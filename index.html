<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>안전 골든벨 챌린지</title>
<style>
:root{--navy:#1d3557;--gold:#f5b400;--bg:#fff6dc;--ok:#2e9e5b;--no:#e0483e;--card:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fff6dc,#ffe3a3);color:var(--navy);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(29,53,87,.12);margin-bottom:12px}
h1{font-size:28px;margin:6px 0;text-align:center}
.sub{text-align:center;opacity:.75;font-size:14px;margin-bottom:10px}
.hero{font-size:64px;text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;min-height:54px;padding:10px 16px;font-weight:700;font-size:17px;color:var(--navy);background:#e9eef7;box-shadow:0 4px 0 rgba(29,53,87,.18);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(29,53,87,.18)}
button.big{width:100%;margin:6px 0;text-align:left;display:flex;gap:10px;align-items:center}
button.gold{background:var(--gold)}button.navy{background:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:14px;border:2px solid #cfd8e6;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;gap:8px}
.bar{height:12px;border-radius:8px;background:#e6ebf3;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--gold);width:100%}
.bar i.low{background:var(--no)}
.q{font-size:20px;line-height:1.5;font-weight:700;margin:12px 0;word-break:keep-all}
.opt{width:100%;margin:6px 0;text-align:left;font-weight:600;line-height:1.4;background:#f1f5fb;display:flex;gap:10px}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox button{font-size:30px;min-height:110px;justify-content:center;text-align:center}
.opt.right{background:#c9f0d7;animation:pop .35s}.opt.wrong{background:#ffd1cd;animation:shake .35s}
.fb{border-radius:16px;padding:12px;margin-top:10px;font-size:15px;line-height:1.5}
.fb.ok{background:#e4f7ea}.fb.no{background:#fdeceb}
.chip{display:inline-block;background:#fff3c4;border-radius:12px;padding:2px 10px;font-weight:700}
.wl{font-size:14px;line-height:1.5;border-top:1px dashed #cfd8e6;padding:8px 0}
.conf{position:fixed;top:-40px;font-size:28px;animation:fall linear forwards;pointer-events:none}
.swing{display:inline-block;animation:swing 1s ease-in-out infinite;transform-origin:top center}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes swing{50%{transform:rotate(18deg)}0%,100%{transform:rotate(-18deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// 데이터: [유형(0=객관식,1=OX,2=주관식), 영역, 문제, 보기, 정답, 해설]
const DATA=[[0,0,"초등학생에게 가장 위험한 학교 시설물은 무엇일까요?",["계단","놀이기구","수돗가","운동장"],0,"우리 어린이들이 매일 등교해 생활하는 학교에도 어린이의 안전을 위협하는 것은 곳곳에 있지요. 그중 우리 어린이들이 가장 조심해야 할 것은 바로 계단입니다. 계단 사고를 예방하기 위해 가장 중요한 것은 질서예요. 계단에서 내려올 때는 장난치지 말고, 한 걸은 한 걸음 발을 바꿔 천천히 내려오면 계단은 더이상 위험한 곳이 아닙니다. 1. "],[0,0,"아이들이 미끄러져도 미끄러짐을 충분히 흡수해 줄 수 있는 고무나 금속으로 미끄럼 방지턱을 설치해야 합니다. 02. 어린이들에게 허리 통증을 호소하게 만들고, 척추 부상을 입힐 수 있는 이것은 무엇일까요?",["의자","자전거","책가방","스케이트 보드"],2,"10명 중 3명의 어린이들에게 허리 통증을 호소하게 만드는 책가방, 무거운 책가방을 메면 척추가 받는 압력이 늘어나면서 턱이 가슴 쪽으로 숙여지고, 키가 작아질 수도 있습니다. 또한 척추가 S자 형으로 휠 위험이 있고, 심한 경우 척추가 옆으로 휘면서 몸 안의 내장에 나쁜 영향을 주는 척추 측만증이 생길 수도 있습니다. "],[0,0,"운동장을 뛸 때 일반적으로 시계 반대 방향으로 도는 이유는 무엇일까요?",["습관적인 행동이다.","더 편하기 때문이다.","운동장이 좁기 때문이다.","원심력에 의한 심장의 부담을 줄이기 위함이다."],3,""],[0,0,"성장에 가장 중요한 역할을 하는 성장판을 다치게 할 가능성이 가장 높은 동작은 무엇일까요?",["흙이 깔려있는 운동장에서 달리기를 하다 슬라이딩 했다.","거실에서 스트레칭을 하다 허리를 삐었다.","인조 잔디 위에서 줄넘기를 하다 엉덩이를 다쳤다.","아스팔트에서 인라인스케이트를 타다 바닥에 손을 디디며 넘어졌다."],3,"늘 부딪히고 넘어지곤 하는 우리 어린이들. 이렇게 다치면 성장에 가장 중요한 역할을 하는 성장판이 손상되는 일이 많아요. 주로 관절 부분에 있고 연골 조직으로 되어있는 성장판. 성장판이 손상되면 성장이 멈추거나 팔다리의 변형 등 후유증을 남길 수도 있습니다. 따라서 평소의 올바른 운동 습관이 중요합니다. "],[0,0,"스케이트보드에 의한 사고를 예방하는 방법으로 옳지 않은 것은 무엇일까요?",["보호 장구를 착용한다.","공원과 같이 안전한 장소에서 탄다.","밤에 자주 이용한다.","전문가들의 묘기를 흉내 내지 않는다."],2,""],[0,0,"아파트 등 공동 주택에 있는 공동출입문 때문에 일어나는 사고 중 가장 많은 것은 무엇일까요?",["문을 지나다 발목이 삐었다.","문 사이에 손가락이 끼어 절단됐다.","닫히는 문에 부딪혀 코피가 났다.","출입문 유리가 깨지며 파편에 베었다."],3,"아파트 등 공동 주택에는 사람들이 지나다니도록 만들어 놓은 공동 출입문이 있어요. 그런데 이 공동 출입문을 드나드는 어린이들에게 사고가 끊이지 않고 있습니다. 사고의 가장 큰 원인은 작은 충격에도 쉽게 깨지고, 깨진 조각도 날카로운 일반 판유리를 사용한다는 데 있어요. "],[0,0,"아이들이 놀 때 착용하지 말아야 할 이것은 무엇일까요?",["슬리퍼","벙어리장갑","모자 달린 옷","마스크"],2,"옷에 달린 모자와 끈은 미끄럼틀이나 철봉 같은 놀이기구에 걸렸을 때 어린이 혼자 힘으로 걸린 부분을 빼내지 못해 사고가 발생하기 쉽습니다. 놀 때뿐만 아니라 자동차 문에 걸리는 일도 많아요. 따라서 어린이는 되도록 모자가 달린 옷을 입지 않는 것이 좋습니다. "],[0,0,"손가락, 발가락 끼임 사고! 넘어져 깔리거나 추락사고까지 불러오는 이것은 무엇일까요?",["비상문","경사로","화물용 엘리베이터","에스컬레이터"],3,"움직이는 계단으로 백화점이나 공공시설에 꼭 필요한 에스컬레이터는 움직이는 특성 때문에 사고의 위험이 있어요. 에스컬레이터에서 발을 올리는 디딤판과 손잡이가 있는 난간 사이의 틈에 옷자락이나 신발 끈이 기이는 등 사고가 자주 발생합니다. 1. 에스컬레이터에서는 이야기를 하거나 장난치지 말아야 합니다. 2. "],[0,0,"유모차를 끌고 에스컬레이터를 이용하려는 아주머니를 보았습니다. 다음 중 어떤 행동을 해야 할까요?",["유모차가 계단에서 떨어지지 않도록 아래에서 받혀준다.","에스컬레이터에서 유모차를 끌고 타면 위험하니 엘리베이터를 이용하라고 말씀드린다.","유모차를 앞질러 먼저 에스컬레이터에 탑승한다.","무시하고 지나간다."],1,""],[0,0,"에스컬레이터 계단 위에 표시된 노란색 선은 무엇을 의미할까요?",["예쁘게 꾸미려고","노란 안전선 안에 발을 올려놓으라고","어린이를 위한 놀이시설","물감이 남아서"],1,""],[0,0,"에스컬레이터의 움직이는 손잡이 밖으로 머리를 내밀면 어떻게 될까요?",["바람이 불어 머리가 시원하다.","아무런 문제가 없다.","멋져 보인다.","옆 기둥에 부딪히거나 머리가 끼어 다칠 수 있다."],3,""],[0,0,"엘리베이터를 타고 윗층으로 올라가려던 철수는 영희가 엘리베이터에 타기위해 뛰어오는 것을 발견하였습니다. 다음 중 어떤 행동을 해야 할까요?",["나랑 별로 친하지 않으므로 문 닫힘 버튼을 눌러 먼저 올라간다.","영희가 들어올 때까지 문 열림 버튼을 눌러준다.","문이 닫히지 않게 손으로 문을 잡는다.","빨리 뛰어오라고 발로 쿵쿵 소리를 낸다."],1,""],[0,0,"한해 200건의 접수가 이뤄지는 이것에 의한 사고로 어린이가 중상을 입거나 사망하기도 합니다. 무엇일까요?",["회전문","셔터","무빙워크","화물용 엘리베이터"],0,"백화점 등의 큰 건물에 있는 회전문은 냉난방비의 낭비를 줄이고, 건물모양을 보기 좋게 만들지만 사용자의 부주의나 안전관리가 부족할 때는 커다란 사고를 부릅니다. 우리나라는 아직까지 회전문에 대한 안전 기준과 인식이 부족해 안전장치들이 제대로 작동하지 않는 경우가 많아요. 안전수칙을 지켜 사고가 일어나지 않도록 조심해야 해요. "],[0,0,"명확한 주의 문구가 없어 부딪힘 사고의 위험이 큰 이것은 무엇일까요?",["입간판","현수막","유리문","전봇대"],2,"바쁜 일상에 쫓기는 사람들은 급하게 걷다 유리문에 부딪히는 경우가 많아요. 게다가 요즘은 투명도가 높아 유리가 있는지조차 구별하기 힘든 백유리를 사용하기 때문에 유리에 부딪혀 다치는 사고가 많아지고 있어요. 특히 급히 뛰어가는 사람이나 시력이 나쁜 사람, 주의가 산만한 어린이 등이 사고의 위험에 노출되어 있습니다. "],[0,0,"다음 중 놀이기구 탑승이 제한되지 않는 사람은?",["임산부","노소약자","음주자","청소년"],3,""],[0,0,"평소에는 위험해 보이지 않지만 높은 곳에서 떨어지면 큰 부상을 입힐 위험이 있는 이것은 무엇일까요?",["물풍선","비둘기","터진 농구공","원반"],0,"고층 아파트가 많아지면서 높은 층에서 떨어진 물건에 의해 발생하는 사고가 늘어나고 있어요. 위험해 보이지 않는 물건도 높은 곳에서 떨어지면 흉기로 돌변한다는 것, 알고 있나요? 가벼운 물건도 높은 곳에서 떨어지면 가속도가 붙으면서 수백 킬로그램의 무게를 가진 물건과 똑같은 충격을 주게 되어, 장난삼아 떨어뜨린 물건에 맞아 사망 사고로 이어…"],[0,0,"화재 사고 사망자가 생기는 가장 큰 원인은 다음 중 무엇일까요?",["화재 사실을 늦게 알아 피난 시간이 부족함","이동 중 부상을 입어 움직일 수 없음","장애물 때문에 대피할 길을 찾지 못함","베란다로 뛰어내리는 등 위험한 방법으로 대피함"],0,"화재는 시작된 집뿐만 아니라 옆집이나 윗집 등으로 순식간에 번지게 되고, 연기는 그보다 더 빨리 번져 질식사 등을 일으킬 수 있습니다. 따라서 화재가 시작되는 그 즉시 이를 알고 대처하는 것이 가장 중요해요. 빨리 알려 줄일 수 있는 화재 피해! 화재경보기로 대비해요. "],[0,0,"횡단보도를 건널 때 뛰어갈 경우, 천천히 걷는 것보다 사고위험이 몇 배 높을까요?",["7배","14배","18배","22배"],0,""],[0,0,"학교에서 일어나는 안전사고 중 가장 많이 일어나는 사고는 무엇일까요?",["넘어짐 및 미끄러짐","학생 간의 충돌","눌림 및 깔림","날카로운 물건을 베임"],0,"안전해야 할 학교에서도 사고가 끊이지 않고 있습니다. 그중 가장 많이 일어나는 사고는 학생들의 부주의와 신고 있는 간편한 슬리퍼에 의해 일어나지요. 슬리퍼는 신고 벗기 편하기 때문에 많은 학생들이 좋아하지만 밑창과 발등을 덮는 밴드 부분만 있어 벗겨지기 쉽습니다. "],[0,0,"한국 소비자원이 분석한 초등학생 안전사고 중 가장 많이 발생하는 사고유형은?",["충돌, 충격사고","넘어짐, 미끄러짐","눌림, 끼임","전기, 고온화상"],1,""],[0,0,"몸이 아파 약을 먹어야 할 때 해야 할 행동으로 바람직하지 않은 것은 무엇일까요?",["부모님께 알린다.","집에 있는 약을 찾아서 먹는다.","반드시 용도와 용법을 알고 먹는다.","의사나 약사의 처방을 받는다."],1,""],[0,0,"가정에서 많이 볼 있는 약품의 잘못된 보관법은 무엇일까요?",["손에 닿은 약은 다시 약병에 넣지 않는다.","여름에는 알약도 냉장고에 넣는다.","안약은 사용 후 용기 뚜껑을 소독해야 한다.","약 보관 상자에는 습기 제거제를 넣는다."],1,"손쉽게 아픔을 가라앉혀 주는 약. 그렇지만 올바르게 보관하지 않으면 변질되기 쉽습니다. 하지만 변질된 약은 오히려 우리 몸에 독이 될 수 있어요. 약은 대부분 습기에 약합니다. 특히 알약은 겉면에 코팅까지 되어 있어 더욱 습기에 약하지요. "],[0,0,"집안에서 아이들이 안전을 가장 위협하는 이것은 무엇일까요?",["에어컨","액자","화분","텔레비전"],3,"우리가 매일 생활하고 있는 집 안에도 어린이의 안전을 위협하는 물건이 많습니다. 그 중 텔레비전이 넘어지면서 그 밑에 유아가 깔리면 목숨을 잃는 사고가 나기도 합니다. 텔레비전은 크고 무거워서 잘 쓰러지지 않을 것 같지만 무게 중심이 앞쪽에 있어 의외로 쓰러지기가 쉬워요. "],[0,0,"다음 중 미아가 가장 많이 발생하는 곳은 어디일까요?",["집 근처","시장","어린이집 주변","공원"],0,"매년 3,000명이 넘는 아이들이 사라지고 있는 미아 사고. 익숙한 곳이라고 생각하는 집 근처에서도 잠깐의 방심으로 가장 많은 미아가 발생하고 있습니다. 가정의 행복을 파괴하는 미아 사고. 예방법을 알아봐요. 1. 어린 아이들은 호기심이 강하고 어른들과는 시간 개념이 다르므로 ‘잠깐이니까’ 라는 생각으로 아이기 혼자 있게 해서는 안 돼요."],[0,0,"옥상에서 장마 대비를 위한 공사를 하던 중 갑자기 발생한 화재, 원인은 무엇일까요?",["옥외에 스프레이식 해충약을 뿌렸다.","일회용 라이터를 사용했다.","롤러로 유기 용제형 발수제를 발랐다.","붓으로 수용성 페인트칠을 했다."],2,"장마철에 물이 새는 것을 막기 위해 옥상이나 벽면에 바르는 유기 용제형 발수제는 시너, 솔벤트 등 불이 쉽게 붙는 물질로 이루어져 있습니다. 이 물질은 인화점이 매우 낮아 온도가 조금만 올라가도 쉽게 불이 붙기 때문에 기온이 높은 여름철에 작업을 하면 화재의 위험이 높아지는 것입니다. "],[0,0,"즐거워야 할 파티. 그러나 이것 때문에 고막이 파열되는 사고가 생길 수 있습니다. 무엇 일까요?",["장난감 나팔","눈 스프레이","생일 폭죽","헬륨 풍선"],2,"커다란 소리와 화려한 모습으로 파티에 빠지지 않는 단골손님인 폭죽. 그렇지만 폭죽으로 인해 고막이 파열되고 심하면 청력을 잃어 귀가 들리지 않게 되기도 합니다. 폭죽 하나가 터질 때 나는 평균 소음은 90데시벨이 넘고 폭죽 여러 개가 동시에 터질 때는 100데시벨이 훨씬 넘는 소리가 납니다. "],[0,0,"화재가 발생하면 유독가스에 의한 질식사망자가 많이 발생하는데, 다음 중 유독가스를 가장 많이 발생시키는 물건은 무엇일까요?",["공책이나 종이","나무로 만든 마루","소파의 스펀지","이불"],2,""],[0,0,"전기 합선과 과열로 인해 화재 위험이 있는 것은 무엇일까요?",["형광등","선풍기","휴대전화 충전기","전자모기향"],1,"소방방재청 통계 결과 한 해 동안 선풍기로 인한 화재가 200여 건이나 발생해 많은 인명  눈물을 계속 흘린다."],2,"염색약을 비롯한 락스나 세제 등 우리 가정에서 흔히 볼 수 있는 여러 가지 화학 합성물들은 강한 알칼리성을 띠고 있습니다. 이런 물질이 눈에 들어가면 염증과 녹내장, 심하면 시력을 잃을 수도 있으므로 빠른 응급 처치가 필요해요. 강한 알칼리 성질을 가진 염색약은 눈에 들어갈 경우 곧바로 흐르는 물을 이용해 씻어 내야합니다. 1. "],[0,0,"다음 중 화상에 대한 응급처치로 옳지 않은 것은 무엇일까요?",["화상부위를 신속히 수돗물에 적시거나 담급니다.","화상 부위에 붙어 있는 옷 등은 제거하지 말고 더러운 물건이 접촉하지 않도록 합니다.","화상 부위에는 간장, 기름, 된장 등을 발라 둡니다.","소독 거즈가 있는 경우에는 화상 부위를 덮어주는 것이 좋습니다."],2,"화상 부위에는 간장, 기름, 된장 뿐 아니라 로션, 연고, 기름 등을 바르지 않습니다. 이는 2차 감염의 우려가 있습니다."],[0,0,"다음 중 귓속에 벌레가 들어갔을 때 적절한 조치는 무엇일까요?",["면봉으로 후빈다.","스포이드로 귓속에 물을 떨어뜨린다.","손전등을 귀에 비춘다.","나올 때까지 그냥 가만히 둔다."],2,"벌레가 귀로 들어가면 당황하지 말고 손전등을 귀에 비춰 벌레가 불빛을 따라 밖으로 나올 수 있게 하세요. 만약 벌레가 귓속에서 죽었다면 베이비오일을 1~2방울 떨어뜨리고 귀를 아래쪽으로 기울여 벌레가 미끄러져 나오게 합니다."],[0,0,"다음 중 엘리베이터가 고장 나서 갇힌 경우 올바른 대처방법은 무엇일까요?",["손으로 문을 연다.","엘리베이터 천장을 통해 탈출해 본다.","침착하게 엘리베이터 문에 기대어 기다린다.","비상 버튼을 찾아 누르고 도움을 요청한다."],3,"고장 난 엘리베이터 안에서는 일어서 있는 것보다는 가장자리에 기대어 앉아있는 것이 좋습니다. 기계 이상으로 갑자기 추락하는 사고가 발생할 수 있기 때문입니다. 그리고 엘리베이터 문은 튼튼해 보이지만 버티는 힘이 없어서 위험하므로 기대지 않도록 합니다."],[0,0,"엘리베이터를 타려고 보니 문은 열려 있는데 엘리베이터는 보이지 않습니다. 어떻게 해야 할까요?",["버튼을 눌러본다.","문을 손으로 닫아본다.","고개를 내밀어 안을 들여다본다.","가까이 가지 않고 계단을 이용한다."],3,""],[0,0,"다음 중 올바른 에스컬레이터 이용방법은 무엇일까요?",["신발 끈이 잘 묶여 있는지 확인한다.","뒷사람을 위해 걸어 올라간다.","재미삼아 역방향으로 이용할 수도 있다.","유모차나 카트기를 가지고 탈 수 있다."],0,"에스컬레이터를 타기 전에는 신발 끈이 잘 묶여 있는지, 바지가 끌리지는 않는지 등을 확인하고 발밑을 잘 보고 계단에 올라섭니다."],[0,0,"다음 중 식중독 증상이 나타났을 때 올바른 대처방법은 무엇일까요?",["집에 있는 약을 먹어 구토와 설사를 멈추도록 한다.","설사 증세가 있는 사람은 탈수 방지를 위해 충분한 물을 섭취한다.","탈수 방지를 위해 과일즙이나 탄산음료를 많이 마신다.","즉시 밥을 많이 먹어 체력을 보충한다."],1,"독물을 체외로 배출해야 하므로 구토 설사 시 임의로 약을 먹어 멈추게 하면 안됩니다. 그리고 지사제 등 설사약은 함부로 복용하지 말고 반드시 의사의 지시를 따라야 합니다. 지사제는 설사를 통하여 자연적으로 몸 밖으로 배출되는 세균이나 세균성 독소 등의 배출을 막아 몸 속에 쌓이게 하여 더 심각한 증상을 초래할 수 있습니다."],[0,0,"다음 중 물에 들어갈 때 준비사항으로 옳지 않은 것은 무엇일까요?",["준비운동을 한 다음 다리부터 서서히 들어간다.","식사 후 2시간 이내에는 물에 들어가지 않는다.","수영에 자신이 있는 경우 배 밑으로 헤엄쳐 나가는 정도는 괜찮다.","초보자는 수심이 얕다고 안심해서는 안된다."],2,"수영에 자신이 있더라도 배 혹은 떠 있는 큰 물체 밑을 헤엄쳐 나가는 것은 매우 위험합니다. 그리고 숨을 들이쉰 상태에서 부력으로 배 바닥에 눌려 빠져나오기 어려울 때는 숨을 내뱉으면 몸이 아래로 가라앉기 때문에 배 바닥에서 떨어져 나오기 쉽습니다."],[0,0,"공연관람 중 비상사태가 발생하였을 때 대처방법으로 옳지 않은 것은 무엇일까요?",["정전이 되면 신속히 짐을 챙겨 대피한다.","대피지시가 있을 경우 유도등을 따라 대피한다.","화재가 발생 시 ‘불이야’하고 큰소리로 외친다.","한꺼번에 출입구에 몰려들지 않도록 앞사람 먼저 차례대로 대피한다."],0,"갑자기 정전되면 당황하지 말고 안내요원의 안내가 있기까지 자리에서 기다려야 합니다. 보이지 않는 상황에서 각자 움직일 경우 다른 사람이나 물체에 부딪혀 혼란이 가중될 수 있습니다."],[0,0,"다음 중 빙판길과 비슷한 것은 무엇일까요?",["운동장","잔디밭","맨홀 뚜껑","보도블록"],2,"우리가 빙판길에서 자주 넘어지는 이유는 바로 마찰력 때문입니다. 빙판길과 맨홀 뚜껑은 표면이 매끄럽기 때문에 마찰력이 약해 쉽게 미끄러집니다."],[0,0,"다음 중 빙판길에서 넘어지지 않는 자세로 옳지 않은 것은 무엇일까요?",["몸을 앞쪽으로 약간 구부린다.","보폭을 넓혀 걷는다.","발을 떼지 말고 끌어서 움직인다.","손을 주머니에 넣지 않는다."],1,"빙판길을 걸을 때는 몸을 앞쪽으로 약간 구부리거나 무릎을 약간 구부려서 무게중심을 앞으로 가게하고, 보폭을 줄이고, 심한 빙판에서는 발을 떼지 말고 끌어서 움직이는 것이 좋습니다."],[0,0,"억류 및 납치 시 대처요령으로 옳지 않은 것은?",["인질로 어류 및 납치 감금을 당했다면 저항하지 말고 급작스러운 행동을 피한다.","탈출 성공의 가능성이 있다면, 용기를 내어 시도한다.","납치범들이 무엇인가를 물어 올 때는 짧고 자연스러운 자세로 대답한다.","눈을 가리면 주변의 소래·냄새·피랍로 경사와 거리·범인 음성 등을 기억한다.","구출작전이 전개될 때는 즉시 엎드려야 한다."],1,""],[0,0,"컴퓨터에서 주변 대피시설을 찾으려면 어디에 접속하는 것이 좋을까요?",["기상청","금융감독원","경찰청","국가재난정보센터"],3,"컴퓨터에서 대피시설을 찾으려면 ‘국가재난정보센터’에 접속 → 민방위 대피시설 클릭 → 지역 검색 → 대피시설 및 급수시설 확인"],[0,0,"신종감염병을 예방하기 위한 생활습관으로 옳지 않은 것은 무엇일까요?",["손으로 눈, 코를 자주 마사지 해준다.","흐르는 물에 비누로 손을 자주 씻는다.","채소는 흐르는 물에 씻고 가열해 먹는다.","실내를 깨끗이 하고 환기를 자주 시킨다."],0,"손은 우리 몸에서 가장 많은 세균이 사는 곳입니다. 그러므로 손으로 눈, 코, 입을 만지는 것은 감염 가능성을 높이는 것입니다."],[0,0,"다음 중 자전거 안전운전 규칙으로 옳은 것은 무엇일까요?",["어두운 색의 안전모 쓰기","날이 어두워지면 빨리 달려 집으로 가기","자동차 운전자의 사각지대로 들어가기","밝은 색 옷 입기"],3,"운전자의 눈에 잘 띄기 위해 항상 밝은 색의 옷을 입고 안전모를 써야 합니다."],[0,0,"교통사고, 추락 사고에 이어 우리나라 사망 사고 원인 3위를 차지하고 있는 이것은 무엇일까요?",["익수 사고","화재 사고","가스 질식사고","감염 사고"],0,"바다나 수영장, 계곡 등 물이 있는 곳에서 끊임없이 발생하는 익수 사고로 목숨을 잃는 사람들이 많아요. 특히 20세 이하 청소년과 어린이가 전체 사고자의 20%를 넘는다고 합니다. 수영장에 들어서자마자 물에 뛰어들거나 다른 사람을 물에 빠뜨리는 장난, 음식을 먹은 뒤 바로 물에 들어가는 행동은 매우 위험합니다. "],[0,0,"운동 기구로 일어나는 안전사고 중 가장 많이 일어나는 사고는?",["미끄러짐","감전","눌림","끼임"],3,"운동 기구 사고의 70%는 아이가 있는 집에서 일어납니다. 특히 러닝머신에서 가장 많이 일어나는데, 빠르게 움직이는 벨트의 양쪽 틈새나 벨트 끝 부분과 바닥 사이에 신체 일부나 옷이 끼이는 사고가 많습니다. "],[0,0,"해수욕장에 들어갈 때 주의할 사항이 아닌 것은?",["반드시 준비운동을 하고 물에 들어간다.","식후 1시간이 지난 후 물에 들어간다.","사람들과 떨어져서 혼자 수 조치하는 것이 좋을까요?",["이마와 코 사이(콧등)에 냉찜질을 한다.","이마와 코 사이(콧등)에 온찜질을 한다.","고개를 뒤로 젖힌다.","숨쉬기 답답하므로 코를 막지 않는다."],0,"코피가 날 경우 고개를 아래로 숙입니다. 뒤로 젖힐 경우 피가 기도로 넘어갈 수 있기 때문입니다. 5~10분간 코뼈 바로 아래 부분을 세게 누릅니다. 탈지면이나 깨끗한 휴지로 코피가 나는 콧속을 막아 출혈을 막습니다. 냉찜질로 콧속 혈관을 수축하여 출혈을 막습니다."],[0,0,"다음 중 상처에서 피가 날 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["일회용 장갑을 끼고 소독을 한다.","상처부위는 심장위치보다 낮게 한다.","소독한 거즈나 깨끗한 천으로 상처부위를 완전히 덮는다.","상처 치료용 거즈 위에 붕대를 감고, 병원에 간다."],1,"상처에서 피가 날 경우 상처부위를 심장위치보다 높게 올려 심장에서 뿜어져 나오는 피가 상처 쪽으로 쉽게 도달하지 못하도록 하여 출혈을 줄이는 것이 좋습니다."],[0,0,"다음 중 벌에 쏘였을 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["꿀벌에 쏘였을 경우 비눗물로 상처부위를 깨끗이 씻는다.","항히스타민제 연고를 바른다.","붓거나 가려우면 온찜질을 한다.","벌침을 제거하기 힘들 경우 바로 병원으로 간다."],2,"꿀벌의 독은 산성이므로 생리식염수 또는 비눗물로 깨끗이 씻고, 말벌의 독은 알칼리성이므로 레몬수나 식초로 씻습니다. 항히스타민제 연고를 바르는 것이 좋습니다. 쏘인 부위가 붓거나 가렵다는 것은 벌침의 독이 남아 있다는 뜻이므로 온찜질을 하면 피부와 혈관이 팽창하여 독이 쉽게 퍼져나갈 수 있기 때문에 냉찜질이 더 좋습니다."],[0,0,"다음 중 뱀에 물렸을 경우 대처방법으로 옳은 것은 무엇일까요?",["뱀이 생김새를 기억하여 의사에게 알린다.","뱀에 물린 부위를 탄산수로 씻어낸다.","몸을 움직여 땀을 낸다.","상처부위를 입으로 빨아낸다."],0,"뱀은 종류가 굉장히 다양하고 종류에 따라 독의 성질도 다릅니다. 그러므로 함부로 독을 입으로 빨거나 상처를 절개하는 것은 위험하고 즉시 119에 신고하거나 병원에 이동하여 의사에게 뱀의 생김새를 알리면서 응급조치를 받는 것이 좋습니다."],[0,0,"다음 중 뱀에 물렸을 경우 어떻게 처치해야 할까요?",["환자를 안정시키고 물린 팔 또는 다리를 심장보다 낮게 위치시킵니다.","일단 상처를 칼로 절개하여 입으로 빨아냅니다.","뱀을 잡으려고 시도합니다.","상처에 얼음을 대어 통증을 완화시킵니다."],0,"상처를 칼로 절개하면 혈관, 신경 등 구조물을 손상할 뿐 아니라, 2차감염이나 파상풍의 위험이 더 커지게 됩니다. 냉찜질은 통증을 어느 정도 완화할 수 있으나, 독의 흡수를 지연시키는 효과는 없으며, 오히려 상처부위의 손상을 가중시킬 수 있습니다."],[0,0,"머리를 뒤로 젖힌 후 코를 손으로 잡고 입으로 공기를 불어넣어주는 응급조치를 무엇이라 하나요?",["심장압박","인공호흡","숨쉬기 운동","그냥 놀이의 종류이다."],1,""],[0,0,"인공호흡을 하는 방법 중 틀린 것은?",["머리를 뒤로 젖힌다.","산소가 들어가도록 코를 막지 않고 입으로 공기를 불어넣는다.","가슴을 살펴보고 호흡상태를 확인한다.","입을 열기 어려울 때는 공기를 코로 불어넣는다."],1,""],[0,0,"다음 중 심폐소생술의 방법이 잘못된 것은 무엇일까요?",["어깨를 두드려 의식을 확인한다.","환자의 머리가 위에 오도록 비스듬한 곳에 눕힌다.","분당 100회의 속도로 심폐소생술을 한다.","가슴 압박 30회 실시 후, 인공호흡을 2회 실시한다."],1,"환자를 평평한 바닥에 눕히고 환자 가슴 옆에 무릎 꿇는 자세를 취하는 것이 안정적입니다. 비스듬히 눕히면 효과적인 흉부압박이 힘듭니다."],[0,0,"다음 중 태풍이나 집중호우 발생 시 피해야 할 곳으로 옳지 않은 것은 무엇일까요?",["축대벽(옹벽) 주변","전신주, 가로등 근처","건물 안","공사장"],2,"태풍이나 집중호우 시 피해야 할 곳으로는 축대벽, 공사장, 하천, 배수로 주위, 전신주, 가로등, 신호등, 고압전선 근처, 돌출된 간판, 길가에 세워진 간판 등이 있습니다."],[0,0,"다음 중 지진해일의 전조증상이 아닌 것은 무엇일까요?",["위아래로 움직이는 해수면","유난히 부글거리는 바다 거품이 밀려옴","해안가로 많은 파도가 밀려옴","해안가로부터 바닷물이 빠져 바닥이 드러남"],2,"지진해일의 일어나기 직전의 증상은 바닷물이 빠지거나 없어지면서 바닥이 드러나고 물고기 떼가 바닥에 흩어져 있는 경우입니다. 파도가 밀려오는 것은 지진해일이 일어나는 현상입니다."],[0,0,"다음 중 포탄, 미사일, 항공기 공격을 받을 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["포탄 및 미사일이 떨어지는 소리가 나면 즉시 엎드린다.","책가방이나 안전모 등을 이용하여 머리를 보호한다.","포성이 멈추면 재빨리 튼튼한 건물구석이나 지하로 몸을 숨긴다.","고막이 파열되지 않도록 귀를 막고 손으로 눈을 덮고 입을 꽉 다문다."],3,"포탄, 미사일 등은 큰 굉음과 함께 충격파를 전달합니다. 이때 고막이 파열되지 않도록 하는 방법은 귀를 손으로 막고 눈을 감고 입을 조금 벌리는 것이 안전합니다."],[0,0,"헬멧 착용과 관련된 법령으로 틀린 것은 무엇일까요?",["14세 미만의 어린이가 자전거를 탈 때 꼭 착용해야 한다.","14세 미만의 어린이를 자전거에 태우고 운행할 때도 착용시켜야 한다.","헬멧의 무게는 5kg을 초과해서는 안된다.","6세 이하의 어린이가 헬멧을 착용하지 않으면 벌금 2만원이 부과된다."],2,"헬멧의 무게는 2kg을 초과해서는 안 됩니다. 바퀴달린 탈 것(자전거, 인라인스케이트 등)을 탈 때는 보호장구를 꼭 착용해야합니다. 보호장구의 종류에는 헬멧, 무릎보호대, 팔꿈치보호대, 손목보호대 등이 있습니다. 1: 보호장구를 구입할 때에는 KC마크를 확인하고 아이의 몸에 맞는 보호장구를 구입해야 합니다. "],[0,0,"횡단보도를 건너는 안전한 방법이 아닌 것은 무엇일까요?",["보도경계석 안쪽에 멈추어 선다.","신호등의 초록불이 켜진 후에도 왼쪽, 오른쪽을 살핀다.","차의 움직임이 완전히 멈춘 것을 확인한 후 걸어서 건넌다.","초록색등에서 점멸등으로 바뀌면 재빨리 뛰어서 건너야 한다."],3,"횡단보도를 건널 때는 먼저 보도 경계석 안쪽에 멈추어 서서 신호등을 확인합니다. 신호등의 초록불이 켜지더라도 바로 건너지 말고 차도의 왼쪽, 오른쪽, 다시 왼쪽을 살핍니다. 차의 움직임이 완전히 멈춘 것을 확인한 후 차의 흐름을 살피면서 걸어서 건너야 합니다."],[0,0,"장소별로 지켜야 할 물놀이 안전수칙으로 알맞은 것은 무엇일까요?",["바닷가나 강가에서는 물의 깊이는 가슴정도가 적당합니다.","바닷가에서는 안전보호장치인 튜브를 꼭 착용합니다.","계곡에서 물놀이를 하다가 비가 오면 즉시 물에서 나와 대피해야 합니다.","수영금지 지역에서는 어른과 함께 얕은 곳에서만 조심해서 물놀이를 합니다."],2,"바닷가나 강가에서 놀기 적당한 물의 깊이는 배꼽정도가 적당합니다. 물살이나 파도를 확인하고 입수해야 하며 수영금지 지역에서는 물놀이를 해서는 안됩니다. 그리고 튜브는 수영보조기구이지 안전보호장치가 아니므로 주의해서 사용해야 합니다."],[0,0,"가정에서의 사고예방을 위한 안전용품에 대한 설명으로 알맞은 것은 무엇일까요?",["모서리 보호대 - 가구 모서리에 부착하여 가구로 인해 바닥이 긁히지 않도록 보호해준다.","손가락 보호대 - 문에 부착하여 문이 닫히더라도 틈이 생겨 손가락이 끼이는 것을 방지한다.","미끄럼방지 스티커 - 화장실 손잡이에 부착하여 물기 묻은 손으로도 쉽게 문을 열 수 있도록 한다.","전기안전덮개 - 물이나 먼지가 콘센트로 흘러들어 전기화재가 일어나는 것을 방지한다."],1,"어린이 안전사고의 60%는 안전하다고 생각되는 가정에서 발생합니다. 가정 안전용품을 사용하면 어린이의 안전사고를 예방할 수 있습니다. "],[0,0,"안전한 장난감 선택 및 사용법에 대한 설명으로 바르지 않은 것은 무엇일까요?",["안전을 위해 KC마크를 확인한다.","뾰족하거나 날카로운 부분이 있는 장난감은 구입하지 않는다.","제조자명, 전화번호 등 품질표시 사항 및 A/S기간 등을 확인한다.","중고 장난감의 경우 안전하게 사용하던 것이므로 깨끗하게 닦아 안심하고 사용한다."],3,"아이들이 많이 가지고 노는 장난감. 장난감을 선택하고 사용할 때도 안전에 유의해야 합니다. 안전한 장난감을 선택하기 위해 KC마크를 확인하고, 뾰족하거나 날카로운 부분이 있는 장난감은 구입하지 않으며, 아이의 연령에 맞는지 확인하고 구입해야합니다. "],[0,0,"횡단보도는 어느 쪽으로 걷는 것이 안전할까요?",["왼쪽","중앙","오른쪽"],2,"도로에서 보면 차량은 오른쪽으로 진행하지만 횡단보도에서 보면 차량은 왼쪽에서 진입하게 됩니다. 따라서 정지선에서 멀리 떨어져 있는 횡단보도의 오른쪽에서 건너는 것이 안전합니다."],[0,0,"신호등이 없는 건널목을 건너는 가장 안전한 방법은 무엇인가요?",["무조건 빨리 뛰어간다.","손을 든 다음 빨리 뛰어 간다.","운전자를 향해 손을 든 다음 차량 멈춤을 확인하고 천천히 건넌다.","차가 안 올 때까지 기다린 다음 얼른 뛰어간다."],2,"횡단보도를 건널 때는 먼저 보도 경계석 안쪽에 멈추어 서서 신호등을 확인합니다. 신호등의 초록불이 켜지더라도 차량이 신호를 무시하고 지나갈 수 있으므로 바로 건너지 말고 차도의 왼쪽, 오른쪽, 다시 왼쪽을 살핍니다. 차의 움직임이 완전히 멈춘 것을 확인한 후 차의 흐름을 살피면서 걸어서 건너야 합니다."],[0,0,"고속도로 상에서의 안전벨트 착용에 대한 설명 중 가장 올바른 것은 무엇인가요?",["운전자만 매면 된다.","운전자와 조수석에 탄 사람만 매면 된다.","차에 타고 있는 모든 사람이 매야 된다.","어른들만 매면 된다."],2,"고속도로에서는 안전을 위해 전좌석 안전벨트 사용이 의무화 되었습니다. 그래서 어른, 아이 구분 없이 차에 타고 있는 사람은 모두 안전벨트를 매어야 하며 어린이는 카시트와 안전벨트를 연결하여 안전을 확보해야 합니다."],[0,0,"소화기 사용 방법 중 틀린 것은 무엇일까요?",["손잡이를 누르지 말고 안전핀을 뽑는다.","바람을 정면으로 맞으면서 불이 난 곳으로 호스를 겨냥한다.","손잡이를 힘껏 움켜쥔다.","불이 난 곳에 골고루 퍼지게 분사한다."],1,"화재가 나면 먼저 불이 번지기 전에 소화기를 이용해 불을 끌 수 있습니다. 먼저 소화기를 화재지점까지 가지고와서 손잡이 부분의 안전핀을 뽑고 바람을 등지고 서서 호스를 불쪽으로 향하게 한 다음 손잡이를 힘껏 움켜쥐고 빗자루로 쓸 듯이 뿌리면 됩니다. "],[0,0,"화재 시 대피 방법으로 틀린 것은?",["고층건물에서 불이나면 엘리베이터를 타고 빨리 대피한다.","수건이나 헝겊에 물을 적셔 코에 대고 자세를 낮춘 뒤 대피한다.","몸에 불이 붙은 경우 멈추고, 엎드리고 몸을 구른다.","불이 난 경우 신속하게 화재가 난 곳에서 대피를 한 후 119에 신고를 하거나 소리를 질러 주변에 알린다."],0,"고층건물에서 화재가 나면 열기와 연기가 위쪽으로 빠른 속도로 번지면서 전기시설을 태워 정전이 되는 경우가 많으므로 전기로 작동하는 엘리베이터는 작동을 멈추게 됩니다. 수건이나 헝겊에 물을 적셔 코에 대고 자세를 낮춘 뒤 계단을 통해 신속히 대피해야 합니다."],[0,0,"식용유(기름)를 사용하던 프라이팬에 불이 난 경우 대처 방법이 틀린 것은?",["담요 또는 이불로 빠르게 불이 난 곳을 덮는다.","소화기 또는 모래로 불을 끈다.","불이 약한 경우는 야채를 많이 넣어서도 끌 수 있다.","양동이로 물을 가져와 빠르게 붓는다."],3,"식용유나 기름 등은 물보다 가벼워서 불이 붙었을 때 물을 뿌릴 경우 물에 떠서 계속 불이 붙어 있을 수 있습니다. 따라서 기름류에 불이 붙었을 경우 담요 또는 이불로 빠르게 불이 난 곳을 덮어 산소를 차단하거나 소화기 또는 모래로 불을 꺼야 합니다. "],[0,0,"소화기에 대한 설명 중 틀린 것은?",["불을 많이 사용하는 부엌에 눈에 잘 띄는 곳에 둔다.","습기가 있는 곳에 작하여 움직이는 차량이 정지한 곳까지 이동한 거리를 말합니다. 공주거리와 제동거리를 합하여 정지거리를 의미합니다. "],[0,0,"잠시 정차한 차량의 뒤에서 놀다가 사고가 발생할 수 있습니다. 그 이유로서 옳지 않은 것은 무엇일까요?",["자동차가 언제 후진할지 알 수 없다.","어린이는 키가 작아서 운전자가 발견하기 어렵다.","모든 운전자는 출발할 때 항상 자동차 주변을 둘러보는 습관이 있다.","사각지대에 있을 경우 운전자가 보지 못할 수 있다."],2,""],[0,0,"횡단보도가 아닌 곳을 가장 안전하게 건너는 방법은 무엇입니까?",["좌우를 살피고 손을 든 다음 빨리 뛰어간다.","보호자가 괜찮다고 하면 안전하므로 믿고 건넌다.","운전자에게 손을 든 다음 차량 멈춤을 확인하고 천천히 건너간다.","횡단보도가 아닌 곳은 건너서는 안되며, 횡단보도까지 이동해서 안전하게 건넌다."],3,"횡단보도가 아닌 곳은 절대 건너서는 안 된다는 것을 명심해야 합니다. 횡단보도가 빨간불일 때 건너면 보행자 신호위반으로 사고 시 어느 정도의 보상을 받을 수 있지만 횡단보도가 아닌 곳에서 건너는 무단횡단은 아무런 보호를 받을 수 없습니다. "],[0,0,"가정에서의 전기사고 예방법 중 틀린 사항은?",["반드시 누전 차단기를 부착한다.","전기기구를 문어발식으로 사용하지 않는다.","젖은 손으로 전기기구를 만지지 않는다.","전선코드를 뽑을 때에는 플러그 몸체대신 플러그 연결선을 잡고 뺀다."],3,"가정에는 반드시 누전 차단기를 설치하여 누전에 의한 감전사고를 예방하고 젖은 손으로는 전기기구를 만져서는 안됩니다. 또 문어발식 배선으로 여러 전기기구를 한 콘센트에 꽂아 사용하는 것은 위험하므로 삼가야 하며 전선 코드를 뽑을 때에는 플러그 몸체를 잡고 빼야 안전합니다."],[0,0,"학교에서 교실 또는 복도에서의 안전수칙에 대한 내용 중 틀린 것은?",["끈이나 줄로 목을 잡아당기는 장난을 하지 않는다.","창문 밖으로 물건을 던지는 장난을 하지 않는다.","복도와 계단에서는 반드시 좌측통행을 한다.","계단은 한 칸씩 내려가며 손을 주머니에 넣으면 안 된다."],2,"해방 후 미 군정기에 미국의 영향을 받아 우측통행이 실시되었지만 보행자 통행은 좌측통행으로 유지하던 것을 2010년 7월부터 공공장소에서의 보행 방법이 우측통행으로 바뀌었습니다."],[0,0,"눈 올 때 안전하게 걷는 방법 중 틀린 것은?",["미끄러져 넘어질 수 있으므로 차와 멀리 떨어져서 걷는다.","눈이 오면 날씨가 어두워질 수 있으므로 하얀 옷을 입고 다닌다.","신발은 미끄러운 구두보다 홈이 파져있는 운동화가 좋다.","털모자, 털목도리를 하여 몸을 따뜻하게 해 준다."],1,"눈길에서 걸어야 할 때는 반드시 인도로 걸어야 합니다. 인도에 쌓인 눈을 피해 차도로 내려오면 눈길에 제동이 제대로 되지 않은 차량으로 인해 사고가 발생할 수 있습니다. 그리고 추운 날씨 때문에 몸을 움츠리고 주머니에 손을 넣고 걷는 경우도 위험합니다. 반드시 장갑을 착용하여 중심을 잡지 못하고 넘어질 경우를 대비해야 합니다. "],[0,0,"눈이 오는 날 조심해야 하는 것 중 잘못된 것은 무엇일까요?",["눈이 오는 날에는 색이 진한 옷을 입는다.","눈 올 땐 우산보다는 눈을 막을 수 있는 모자 달린 옷이 더 좋다.","손에 물건을 들지 않도록 한다.","손을 보호하기 위해 주머니에 손을 넣고 걸어 다닌다."],3,""],[0,0,"얼음판이 깨지면서 어린이가 물에 빠졌습니다. 다음 중 안전한 행동이 아닌 것은?",["빨리 물에 뛰어 들어 어린이를 구한다.","나뭇가지나 옷가지를 던진 후 잡고 올라오도록 한다.","물에 빠진 어린이는 당황하지 말고 주변 얼음 중 가장 단단한 부분을 잡고 엎드린 자세로 천천히 빠져나온다.","119에 빨리 신고한다."],0,""],[0,0,"다음의 어린이 응급처치 방법 중 틀린 것은?",["눈에 이물질이 들어간 경우 20분 이상 물을 부드럽게 흘려준다.","뱀 등 동물에 물렸을 경우 물린 부위를 심장보다 높게 해 주어야 한다.","정신을 잃고 쓰러지면 반듯이 눕힌 후 머리를 옆으로 돌려주며 물, 음료 등 음식물을 먹이지 않는다.","다쳐서 피가 날 경우 흐르는 물로 씻어내고 출혈이 멈출 때까지 깨끗한 천으로 감싸며 출혈이 있는 부위를 심장보다 높게 해 준다."],1,"뱀에 물렸을 경우에는 먼저 119에 도움을 요청하고 난 후 뱀에 물린 부위를 생리식염수나 흐르는 물에 비누로 부드럽게 씻어 줍니다. 탄력붕대는 물린 부위에서 5cm 위쪽으로(심장방향) 손가락 한 개가 들어갈 정도로 감아줍니다. "],[0,0,"질식사고 예방법 중 틀린 것은 무엇인가요?",["아기를 푹신한 이부자리에서 엎드려 재운다.","잠자리에서 엄마가 아이에게 젖을 주지 않는다.","성인용 침대에서 어른과 함께 재우지 않는다.","벽과 침대사이 등 위험한 공간을 두지 않는다."],0,"만 3세 이하의 어린이에게는 3-3.5cm 이하 크기의 음식이나 물건, 장난감은 주워 삼킬 수 있기 때문에 항상 손이 닿지 않는 곳에 두어야 합니다. 베개, 매트는 아이의 얼굴이 파묻혀 코나 입을 막아 질식할 우려가 있으므로 너무 푹신한 것을 사용하지 않고, 엎어 재우면 안됩니다."],[0,0,"사탕이 목에 걸리지 않게 하기 위한 틀린 행동은?",["사탕을 먹으면서 뛰지 않는다.","음식은 천천히 잘 씹어서 먹는다.","사탕이 목에 걸리면 등을 두드리면 된다.","사탕이 목에 걸리면 기침을 크게 한다."],2,"물질에 의한 기도 막힘, 질식(기도폐쇄)은 땅콩, 잣, 사탕, 고깃덩어리, 떡 등의 음식물과 작은 장난감, 풍선 등에 의해서 주로 5세 이하의 아이들에게서 일어나게 됩니다. 기도에 이물질이 걸렸을 때의 특징적인 증상은 두 손으로 목 부분을 쥐면서 기침을 하려고 하며 쌕쌕 소리가 들리거나 얼굴이 파랗게 변하면서 켁켁거리게 됩니다. "],[0,0,"지진이 발생하면 어떻게 해야 하는지 틀린 내용은?",["집 밖의 경우 떨어지는 물건에 주의하며 머리를 보호한다.","집 안에서는 옷장으로 들어가 몸을 보호한다.","집 안에서는 먼저 출입문을 열어 탈출구를 확보한다.","학교 안에서는 선생님의 안내에 따라 안전하게 대피한다."],1,"지진 발생 횟수가 매년 증가하고 있는 점으로 볼 때 우리나라도 지진 안전지대로 볼 수 없습니다. 지진에 대비하여 평소 대비 훈련을 해 두어야 합니다. 지진이 발생하면 실내의 단단한 탁자 밑, 내력벽 사이의 작은 공간 등 평소 안전한 위치를 파악해 두고 비상시 대피하도록 합니다. "],[0,0,"가스 사용 시 주의사항 중 올바르지 않은 것은?",["가스 불을 켜기 전에 가스가 새는지 냄새를 확인한다.","가스를 다 쓴 후 중간밸브도 잠근다.","호스와 이음새 부분에 가스가 새는지 소금물로 수시 점검한다.","평소 연소기 불구멍이 막히지 않도록 청소를 한다."],2,""],[0,0,"가스안전 수칙 4가지에 대한 설명 중 틀린 것은?",["사용 전 냄새확인과 창문열기","사용 중 불구멍과 점화확인","사용 후 점화 콕크와 중간밸브 잠그기","평상시 LP가스 용기를 바람이 잘 통하고 직사광선을 받는 곳에 설치"],3,"4가지 가스안전 수칙은 다음과 같습니다. 첫째, 사용 전 가스불을 켜기 전 가스냄새가 나지 않는지 살펴보고 창문을 열어 가스연소 시 필요한 공기가 실내에 충분히 들어오도록 한다. 둘째, 사용 중 점화를 할 때는 불구멍을 자세히 보고 확실히 점화가 되었는지 확인한다. 불이 붙지 않았는데도 코크를 계속 열어두면 위험하다. "],[0,0,"가스 누출 시 응급대처 방법 중 틀린 것은 무엇인가요?",["전기기구는 조속히 끈다.","당황하지 말고 콕크와 용기 밸브를 잠근다.","창문, 출입문을 열고 환기를 시킨다.","빗자루, 부채, 방석 등을 사용해 밖으로 쓸어낸다."],0,"가스냄새로 가스가 새는 것을 발견하면 먼저 연소기의 점화콕과 중간밸브, 용기밸브를 잠가서 가스공급을 차단하고, 창문과 출입문을 등을 활짝 열어 누출된 가스를 밖으로 몰아내고 신선한 공기로 환기시킵니다. LPG의 경우에는 공기보다 무겁기 때문에 방바닥으로 가라 앉으므로 침착히 빗자루 등으로 쓸어내듯 환기를 시켜야 합니다. "],[0,0,"가스 사고를 예방하기 위한 방법으로 옳지 않은 것은 어느 것일까요?",["창문을 열어 충분히 환기시킨다.","가스 불을 켤 때는 불이 붙었는지 꼭 확인한다.","잠자기 전에 반드시 가스밸브가 잠겨 있는지 확인한다.","가스레인지 주위에 빨래를 널어 실내공기가 건조하지 않게 한다."],3,""],[0,0,"외출 후 집에 들어오니 주방의 가스레인지 주변에서 이상하게 비린 냄새가 납니다. 어떻게 해야 하나요?",["선풍기를 틀어서 냄새가 나가게 한다.","창문을 열고 빗자루나 신문지등으로 냄새를 내보낸다.","그냥 내버려 두면 사라지므로 신경 쓸 필요 없다.","가스레인지에 불을 붙여 라면 끓일 물을 올린다."],1,""],[0,0,"자전거를 안전하게 타기 위한 습관 중 틀린 것은?",["눈에 잘 띄는 밝은 색 옷을 입으며 밤에는 타지 않는다.","헬멧과 무릎보호대를 착용한다.","횡단보도에서는 내려서 걷는다.","차가 다니는 큰길에서 주의하며 자전거를 탄다."],3,"2008년~2013년 어린이 자전거 사고 사상자가 총 9,327명에 이를 만큼 자전거 사고가 많이 일어나고 있습니다. 자전거는 꼭 몸에 맞는 크기로 타야 하고, 보호장구를 착용을 잊지 말아야 합니다. 자전거를 타기 전 바퀴에 바람이 있는지, 브레이크는 잘 작동하는지 체인은 원활하게 돌아가는지를 확인해야 합니다. "],[0,0,"롤러스케이트를 탈 때의 주의사항으로 틀린 것은 무엇일까요?",["발 크기에 맞는 롤러스케이트를 탄다.","무릎보호대, 헬멧과 같은 안전장구를 착용한다.","공중회전이나 지그재그 방향전환을 시도한다.","눈, 비가 올 때나 야간에는 타지 않는다."],2,""],[0,0,"자전거 안전점검을 하지 않았을 때의 설명입니다. 틀린 것은 무엇일까요?",["핸들이 흔들리면 방향을 마음대로 조정할 수 없다.","브레이크가 고장 나면 정지할 수 없어 사고가 발생한다.","타이어 공기압력이 약해지면 힘이 잘 전달된다.","벨과 조명등이 고장 나면 위급 시에 위험을 알릴 수 없다."],2,""],[0,0,"다음 자전거 안전사고 예방을 위한 준비 사항입니다. 틀린 설명은?",["자전거를 타고 무릎이 계속 굽혀지도록 안장을 최대한 낮추어 탄다.","너무 긴 치마나 통이 큰 바지는 체인에 끼일 수 있어 위험하므로 입지 않는다.","샌들, 슬리퍼 등 벗겨지기 쉬운 신발이나 체인에 말릴 수 있는 긴 목도리 등을 착용하고 타지 않는다.","머리를 보호하기 위해 자신의 머리 크기에 맞는 헬멧을 반드시 착용한다."],0,""],[0,0,"일반적으로 시속 60km로 달리던 차가 보행자와 부딪힐 경우 보행자는 ( )m 높이에서 땅으로 떨어지는 충격을 받는다.",["5m","10m","15m","20m"],2,"시속 60km로 달리던 차가 보행자와 부딪힐 경우 보행자는 15m 높이에서 땅으로 떨어지는 충격을 받게 됩니다. 시속 30km로 충돌 시 보행자가 머리에 중상을 입을 가능성은 17%, 시속 40km로 충돌 시에는 29%입니다. 하지만 시속 60km일 경우에는 심각한 중상을 입을 가능성이 99% 이상으로 증가하게 됩니다. "],[0,0,"어린이 보호구역 지정과 관계없는 시설은?",["유치원","초등학교","100인 이상 보육시설","고등학교"],3,""],[0,0,"어린이 보호구역은 일반적으로 학교의 정문 출입구로부터 몇m를 지칭합니까?",["100m","200m","300m","500m"],2,"어린이보호구역이란 초등학교 및 유치원 주출입문에서 반경 300m 이내의 주통학로를 보호구역으로 지정하여 교통안전시설물 및 도로부속물 설치로 학생들의 안전한 통학공간을 확보하여 교통사고를 예방하기 위한 제도로 ‘스쿨존(School Zone)'이라고도 합니다. "],[0,0,"과학실에서 지켜야 할 안전수칙으로 바르지 않은 것은 무엇일까요?",["실험복을 입고 필요할 경우 마스크와 장갑을 착용한다.","시약을 사용할 때는 시약의 이름표(라벨)를 확인한다.","선생님의 허락 없이 시약 맛보기, 냄새 맡기, 만지기를 하지 않는다.","시험관을 사용할 때는 내용물을 잘 볼 수 있게 시험관 입구를 똑바로 내려다 본다."],3,"과학실에서는 실험복을 입고 필요한 경우 마스크와 장갑을 착용하며 시약이 눈에 튈 것을 대비하여 보안경도 착용하는 것이 좋습니다. 시약 관리는 선생님이 담당해야 하며 선생님의 허락 없이는 시약을 맛보거나 냄새를 맡으면 안 됩니다. "],[0,0,"동물에게 물렸을 때 해야 할 내용이 아닌 것은 무엇일까요?",["응급조치로 흐르는 물로 물린 상처 부위를 깨끗이 씻고 소독약을 바른다.","상처가 가벼운 경우 소독하는 것으로도 치료가 되므로 안심한다.","주인 없는 개나 고양이에게 물린 경우 바로 병원에 가서 치료를 바른다.","개에게 물렸을 경우 광견병 예방주사를 맞았는지 확인해야 한다."],1,"상처가 가벼워도 반드시 병원에 가서 진료를 받아보는 것이 좋습니다."],[0,0,"공공장소에서 많이 일어나는 사고에 대한 설명으로 알맞지 않은 것은 무엇일까요?",["회전문, 자동문 - 손가락이나 몸이 문틈에 끼이는 사고","엘리베이터 – 문틈에 신체의 일부가 끼이는 사고","쇼핑카트 – 무빙워크에서 미끄러져 내려가 충돌하는 사고","에스컬레이터 – 신발 끈이나 신체의 일부가 끼이는 사고"],2,"쇼핑카트로 인해 일어나는 사고는 주로 아이들이 쇼핑카트 주변을 뛰어다니다가 충돌하는 사고나 탑승해서 장난을 치다가 떨어지거나 손가락 등이 카트에 끼이는 사고가 많이 일어납니다. 따라서 물건을 담는 곳에는 절대 올라타지 않고 아이들끼리 장난을 치면서 쇼핑카트를 밀고 다니는 일이 없도록 주의해야 합니다."],[0,0,"안전한 자전거의 특징으로 볼 수 없는 것은 무엇일까요?",["자전거에 올라타서 두발 끝이 땅에 닿는 자전거","핸들의 높이가 너무 높지 않은 자전거","브레이크가 잘 듣는 자전거","반사체가 부착되지 않은 자전거"],3,""],[0,0,"어린이 통학버스는 무슨 색일까요?",["빨간색","녹색","노란색","검정색"],2,""],[0,0,"다음 중 안전한 자전거 타이어에 대한 설명으로 올바른 것은?",["구멍이 뚫린 타이어","찢어진 타이어","홈이 달아진 타이어","공기가 팽팽하게 들어간 타이어"],3,""],[0,0,"다음 중 장거리 고속버스를 안전하게 타고 있는 어린이는 누구일까요?",["안전벨트를 매지 않고 뒤돌아보고 이야기하는 아이","안전벨트를 매지 않고 졸고 있는 아이","자리에 앉지 않고 서서 장난치는 아이","안전벨트를 매고 앉아 있는 아이"],3,""],[0,0,"자전거를 타기 30초전 점검 할 주요사항이 아닌 것은 무엇일까요?",["타이어의 바람상태","브레이크 작동여부","체인상태","교통 수신호 방법 익히기"],3,"자전거 안전 확인 사항은 ABC로 기억하면 좋습니다. A는 Air(바람상태), B는 Break(브레이크), C는 Chain(체인)입니다. 이 세 가지가 정상적이지 않으면 자전거를 제대로 운행할 수 없습니다. 그리고 자전거를 탈 때는 꼭 보호장구를 착용하고 차가 많이 다니는 도로가 아닌 자전거 전용도로를 이용하는 것이 안전합니다."],[0,0,"교차로에 접근 중인 차량이 자신의 진행 신호가 바뀌는 것을 보고 정지선에 정지해야할지 계속 진행할지를 결정해야 하는 구간을 무엇이라고 하나요?",["딜레마 존","노파킹 존","스피드 존","스톱라인 존"],0,"신호등이 설치되어 있는 교차로를 통과할 때 운전자는 자신의 진행 신호가 바뀔까 노심초사 하는 경우가 있습니다. 이와 같이 신호가 바뀌는 것을 보고 정지선에 서야할지 아니면 진행해야 할지를 결정해야 하는 구간을 ‘딜레마 존’이라고 합니다. "],[0,0,"차량 운행 중 신호위반이 되는 경우 2가지는 무엇일까요?",["적색 신호 시 정지선을 초과해 정지","교차로에 이르기 전 황색 신호 시 교차로에 진입","황색 점멸 신호 시 주의하면서 진행","적색 점멸 신호 시 정지선 직전에 일시 정지한 후 교통상황에 주의하며 진행"],0,"적색 신호는 차량이 멈추라고 하는 신호입니다. 그러므로 적색 신호에는 정지선을 넘기 전에 정지해야 합니다. 황색 신호에는 운전자들이 흔히 속도를 내어 빨리 지나가려고 하지만 황색 신호도 교차로의 정지선 직전에 정지해야 하는 신호입니다. "],[0,0,"다음 중 태풍경보 발령 기준에 해당하지 않는 것은 무엇인가요?",["강풍(또는 풍랑) 경보기준에 도달할 것으로 예상될 때","총 강우량이 200mm이상 예상될 때","폭풍해일 경보 기준에 도달할 것으로 예상될 때","열대성 저기압 중에서 중심 최대풍속이 초당 19m 이상일 때"],3,"태풍은 북태평양 남서해상에서 발생하는 열대성 저기압 중에서 중심 최대풍속이 1초당 17m 이상의 폭풍우를 동반하고 있는 기상현상을 말합니다. "],[0,0,"장마가 시작되는 7월에 특히 많이 일어나는 사고는 장마철 습기로 인한 감전사고입니다. 감전 사고에 대처하는 방법으로 옳은 것은 무엇일까요?",["비가 오는 날 외출할 때는 고무장화를 신는다.","감전된 사람을 발견하면 손으로 전기가 흐르는 물체를 떼어낸다.","신호등이나 전봇대 등 전기가 흐르는 시설에 가까이 간다.","비가 오는 날에는 맨발로 신는 샌들이나 슬리퍼를 신는다."],0,"센 바람과 집중 호우로 안전사고가 많이 발생하는 장마철. 비로 인한 물기와 습기로 인해 이상이 생긴 신호등이나 입간판 등에서 나온 전기가 사람에 닿아 감전 사고가 많이 일어나요. 마른 날과는 달리 비가 오는 날은 사람의 발과 땅이 젖어 있는데, 이때 발과 땅 사이의 저항이 작아져 마른 상태일 때 보다 훨씬 큰 전류가 흘러 위험해집니다. "],[0,0,"바다나 수영장, 계곡 등 물이 있는 곳에서 끊임없이 발생하는 익수 사고를 예방할 수 있는 방법으로 옳은 것은 무엇일까요?",["음식물을 먹은 뒤 바로 물놀이를 한다.","다리나 팔 등의 근육 경련을 막기 위해 준비 운동을 꼭 한다.","심장에 가까운 곳에서 먼 곳으로 물을 묻힌다.","준비운동이 끝나면 바로 물속으로 다이빙해서 들어간다."],1,"바다나 수영장, 계곡 등 물이 있는 곳에서 끊임없이 발생하는 익수 사고로 목숨을 잃는 사람들이 많아요. 특히 20세 이하 청소년과 어린이가 전체 사고자의 20%를 넘는다고 합니다. 수영장에 들어서자마자 물에 뛰어들거나 다른 사람을 물에 빠뜨리는 장난, 음식을 먹은 뒤 바로 물에 들어가는 행동은 매우 위험합니다. "],[0,0,"바다에서 놀다가 수초에 몸이 감겼을 때 주의할 사항으로 옳지 않은 것은?",["부드럽게 서서히 팔과 다리를 움직여 풀어야 한다.","물의 흐름이 있으면 흐름에 맡기고 잠시만 기다리면 수초가 헐거워져 이 때 털어 버리듯이 풀고 밖으로 나온다.","힘을 세게 주면 빠질 수 있으므로 발버둥 치며 빨리 빠져 나온다.","침착하게 호흡하며, 서서히 부드럽게 수직으로 움직여 조금씩 헤엄쳐 나온다."],2,"급하게 발버둥 칠 경우 오히려 더 휘감겨서 위험에 빠질 수 있다."],[0,0,"어린이 안전사고 중 119 구조대 출동 원인 1위를 차지하는 것은‘문 잠김 사고’입니다. 문 잠김 사고를 예방하는 방법으로 알맞지 않은 것은 무엇일가요?",["평소 어린이에게 잠금장치 작동법을 반복적으로 익히게 한다.","현관문 비밀번호를 문 바깥쪽에 붙여놓는다.","현관문 잠금장치 옆에 여는 방법을 자세히 적어놓는다.","어린이는 되도록 집에 혼자 두지 않는다."],1,"안전을 위해 현관문에 다양한 잠금장치를 설치하는 경우가 많습니다. 하지만 순간의 부주의와 작동 방법을 모르는 경우 오히려 위험에 갇힐 수 있어요. 아이가 집에 혼자 있을 때 아이가 잠금 장치를 잘못 눌러 보호자가 집으로 들어가지 못하게 되거나 이중, 삼중으로 되어 있는 잠금장치를 열지 못하고 집안에 갇히는 사고가 일어나게 됩니다. "],[0,0,"안전한 스포츠 활동을 위한 준비운동의 방법으로 알맞지 않은 것은?",["팔, 다리에서 시작하여 몸통 부위로 실시한다.","한 부위가 아닌 전신을 충분히 움직일 수 있도록 실시한다.","주운동보다 높은 강도로 실시한다.","주운동과 관련된 부위에 맞게 다양하게 실시한다."],2,"준비운동은 주운동보다 낮은 강도로 실시해야 한다."],[0,0,"어린이가 사탕이 목에 걸려서 기도가 막혔을 때 가장 먼저 해야 하는 취해야 하는 응급처치법은 무엇일까요?",["뒤에 서서 배꼽과 명치 사이를 강하게 당긴다.","심폐소생술을 실시하면서 구조대를 기다린다.","똑바로 눕혀 기도를 확보하고 인공호흡을 한다.","손가락을 입 속 옆쪽으로 깊숙이 넣어 기도의 이물질을 빼낸다."],0,"기도에 이물질이 걸려 기도가 막혔을 때 의식이 있는 두 살의 이상의 어린이와 어른의 경우에는 하임리히 응급처치법을 이용합니다. 기도가 막혔을 때는 하임리히 응급처치법으로 위기에서 탈출해요."],[0,0,"이물질을 제거하고도 의식이 돌아오지 않으면 심폐소생술을 실시하면서 구조대를 기다립니다. 227. 동화책은 위험해 보이지 않지만 의외로 많은 어린이들이 동화책에 찍히거나 베이는 사고를 당합니다. 이런 사고를 예방하는 방법으로 알맞지 않은 것은 무엇인가요?",["모서리가 둥글게 처리되어 있는 동화책을 구입한다.","헝겊, 스펀지로 되어 있어 안전사고의 위험이 적은 동화책을 구입한다.","책표지 모서리가 날카로워도 그냥 둔다.","날카로운 종이의 날 부분에는 투명 테이프를 붙인다."],2,"알록달록한 그림과 재미있는 이야기가 있는 동화책. 위험해 보이지 않지만 의외로 많은 어린이들이 동화책에 찍히거나 베이는 사고를 당합니다. 동화책 겉표지는 쉽게 구겨지지 않도록 딱딱한 소재로 되어 있기 때문이에요. 이런 단단한 표지는 모서리가 날카롭고 강하기 때문에 부딪히면 큰 상처가 날 수 있습니다. "],[0,0,"날카로운 종이의 날 부분에는 투명 테이프를 붙여 베임 사고를 방지합니다. 228. 14세 이하 어린이가 당하는 안전사고 중 가장 많이 일어나는 사고는‘찔림, 베임'입니다. 이러한 안전사고를 예방할 수 있는 방법으로 알맞은 것은 무엇일까요?",["다 먹은 아이스크림 막대는 입에 문 채로 다닌다.","가위는 사용한 후 벌려진 상태로 그대로 둔다.","칼이나 뾰족한 연필은 사용한 후에 반드시 제자리에 둔다.","꼬치 음식은 꼬치에 꽂힌 채로 음식을 먹는다."],2,"어린이 안전사고는 집, 놀이터, 학교 등 시간과 장소에 관계없이 늘 일어나요. 그 중 14세 이하의 어린이가 가장 많이 당하는 부상은 바로 찔림, 베임입니다. 특히 우리가 사용하는 빨대, 포크, 옷걸이, 우산, 가위, 이쑤시개 등에 다치는 경우가 많아요. "],[0,0,"레포츠 활동을 할 때에는 언제나 헬멧과 보호대 등 안전 장비를 착용하고, 외부의 소리가 들리지 않을 수 있으니 이어폰을 끼지 마세요. 234. 혼자 있다가 뱀에 물렸을 때 가장 먼저 해야 할 행동은 무엇일까요?",["상처 윗부분을 피가 통하지 않게 힘껏 묶는다.","물린 부위에 부목을 댄 후 상처를 심장보다 낮게 한다.","상처 부위에 십자 모양 칼집을 낸 후 피가 흐르게 한다."],1,"독사에게 물렸을 때 가장 먼저 해야 할 응급 처치는 독이 피를 통해 온몸으로 퍼지지 않도록 막는 것입니다. 흔히 독사에게 물리면 독을 입으로 빨아내야 한다고 생각하지만 입 안에 작은 상처라도 있을 경우 오히려 위험해지므로 이 방법은 삼가야 해요. 생명을 위협하는 독사의 독! 넘버원과 함께 독사의 위험에서 탈출해요. 1. "],[0,1,"차내 안전사고가 발생하는 이유로 볼 수 없는 것은 무엇일까요?",["차안에서 장난을 치다가 차가 갑자기 멈출 때","차가 갑자기 서면 관성의 법칙에 의하여 몸이 앞으로 쏠리게 되고 차 내부의 돌출물이나 유리창에 부딪침","안전띠를 매지 않았을 때","차문을 꼭 잠갔을 때"],3,""],[0,1,"6세 미만의 유아를 차에 탑승시킬 때의 주의사항으로 틀린 것은 무엇일까요?",["차의 앞자리에 안고 탄다.","운행 중 문을 열지 않도록 잠금장치를 확인한다.","유아용 보호 장구를 장착한다.","차내에 어린이만 남겨두고 내리지 말아야 한다."],0,""],[0,1,"교통질서와 안전 지키기 실천을 위해서 해야 할 것이 아닌 것은 무엇일까요?",["평소의 교통안전 생활에 대해 반성한다.","교통규칙 지키기 및 안전생활에 대한 약속은 할 필요가 없다.","교통 실천계획을 세우고 앞으로 지켜나간다.","교통안전 생활에 대한 다짐을 글이나 뛰거나 장난치지 않는다.","어린이나 노인·장애인은 난간(손잡이)을 잡고 한 칸씩 천천히 이동한다.","어린이가 계단 주변에서 노는 것은 상관없다."],3,"계단 주변에서는 어린이가 놀지 않도록 한다."],[0,1,"시각 장애인이 안전하게 인도를 걸어서 다닐 수 있도록 발바닥이나 지팡이의 촉감으로 그 존재와 형상을 확인하여 정해진 정보를 판독할 수 있도록 원형(점형)이나 일자모양(선형)으로 표면을 처리하여 설치한 보도블록을 무엇이라 할까요?",["점자블록","사각블록","경계석","횡단보도"],0,""],[0,1,"야간에 도로를 횡단할 때 주의사항으로 옳지 않은 것은?",["육교, 지하도, 횡단보도 등 안전시설이 있는 곳을 찾아가서 길을 건넌다.","야간에 찻길을 건널 때에는 차가 잘 다니지 않으므로 차량이 멈춘 것을 확인할 필요가 없다.","야간에 신호를 기다릴 때 횡단보도에 내려서면 운전자의 눈에 보이지 않아 위험하고, 차량의 뒷바퀴에 다치는 사고의 위험이 크므로 보도의 안쪽으로 물러나서 기다린다.","야간에 도로를 횡단하던 중 신호가 바뀌어 중앙선 부근에 서 있게 되면 차량 운전자의 눈에 사람이 보이지 않게 되어 매우 위험하다. 따라서 중앙선 부분에 서 있지 않기 위해서는 횡단신호가 한참 진행 중인 때에 횡단을 시작하지 않도록 한다."],1,"야간에 찻길을 건널 때에는 반드시 우선 멈추었다가 차가 없을 때나 차량이 멈춘 것을 확인하고 건넌다."],[0,1,"자전거 타기에 대한 설명으로 옳은 것은?",["자전거를 탈 때는 땀 등으로 인해 위생상 문제가 있으므로 안전모는 쓰지 않아도 된다.","자전거가 넘어질 때 무릎과 팔 등을 보호하기 위해 팔 보호대와 무릎 보호대를 반드시 착용해야 한다.","핸들 잡기와 브레이크 조작이 쉽도록 벙어리장갑을 착용해야 한다.","자전거를 탈 때는 통이 넓은 바지를 입어 페달을 밟을 때 움직임이 편하도록 한다."],1,"① 헬멧은 반드시 착용해야 하며, 땀 등으로 위생상 문제가 있으므로 개별 준비해야 한다. ③ 바닥 부분이 고무코팅 되어 있는 장갑을 착용해야 한다. ④ 통이 넓은 바지는 체인에 끼일 수 있으므로 적당하지 않다."],[0,1,"자전거 도로 중 자전거 우선도로에 대한 설명으로 옳은 것은?",["자전거만 통행할 수 있도록 분리대, 경계석, 그밖에 이와 유사한 시설물에 의하여 차도 및 보도와 구분하여 설치한 자전거도로","자전거 외에 보행자도 통행할 수 있도록 분리대, 경계석, 그밖에 이와 유사한 시설물에 의 하여 차도와 구분하거나 별도로 설치한 자전거도로","차도의 일정 부분을 자전거만 통행하도록 차선 및 안전표지나 노면표시로 다른 차가 통행 하는 차로와 구분한 차로","자동차의 통행량이 대통령령으로 정하는 기준보다 적은 도로의 일부 구간 및 차로를 정하 여 자전거와 다른 차가 상호 안전하게 통행할 수 있도록 도로에 노면 표시로 설치한 자전거도로"],3,"① 자전거 전용도로, ② 자전거·보행자 겸용도로, ③ 자전거 전용차로"],[0,1,"어린이보호구역 [ school zone ]에 대한 설명으로 옳지 않은 것은?",["자동차의 통행을 금지하거나 제한하는 것","자동차의 정차나 주차를 금지하는 것","운행속도를 시속 20km 이내로 제한하는 것","이면도로를 일방통행로로 지정·운영하는 것"],2,"운행속도를 시속 30km 이내로 제한하는 것"],[0,1,"하굣길에 일어날 수 있는 위험한 상황은 무엇일까요?",["안전선 뒤에 서서 신호를 기다린다.","하굣길에 한눈을 팔거나 뛰어다니지 않는다.","횡단보도 신호등에 초록불이 켜지자마자 급하게 뛰어 나간다.","이면도로에 있는 자판대에서 음식을 사먹거나 구경하기 위해 모여 있지 않는다."],2,""],[0,1,"어린이를 위한‘부모님의 교통안전 십계명’이 아닌 것은?",["무단횡단 등 어린이 교통사고를 부추기는 행동을 하지 않는다.","교통안전 교육의 중요성과 구체적 교육방법을 먼저 습득한 후 자녀에게 교통안전 교육을 실시한다.","주위에서 발생한 어린이 교통사고 사례를 활용하여 월 1회 이상씩 교통안전 가족회의를 개최한다.","우리 주변 교통법규 위반차량을 사진 찍어 경찰에 고발한다."],3,""],[0,1,"교실 복도를 이용 시 주의사항으로 옳지 않은 것은?",["계단을 이용할 때에는 좌측통행을 하며 조용히 걷는다.","단체로 이동할 때는 질서 정연하게 이동하고 밀거나 뛰지 않는다.","복도에서 장난을 하지 않는다.","슬리퍼는 다치는 상황이 많이 생기므로, 운동화 모양의 가벼운 실내화를 신는다."],0,"계단을 이용할 때에는 우측통행을 하며 조용히 걷는다."],[0,1,"학교 급식시간에 주의할 사항이 아닌 것은?",["반드시 손을 먼저 씻고 식사를 한다.","내가 좋아하는 반찬만 받아서 먹는다.","젓가락이나 포크로 찌르는 장난을 하지 않는다.","뜨거운 음식을 들고 움직일 대는 흘리거나 튀지 않도록 조심한다."],1,"급식을 먹기전 깨끗이 손을 씻는 습관이 중요하다. 편식하지 않도록 하며 젓가락이나 포크 등의 날카로운 부분을 주의한다."],[0,1,"급식 시간의 안전 수칙으로 옳지 않은 것은?",["급식대나 급식운반차를 놀이기구처럼 이용하지 않는다.","식판에 뜨거운 밥이나 국통이 담겨 있을 경우 한 손으로 쥐어 쏟지 않도록 한다.","식판, 젓가락, 포크 등으로 장난치지 않는다.","배식을 받을 때는 질서를 지키고 많은 학생들이 한꺼번에 몰려가지 않도록 한다."],1,"식판에 뜨거운 밥이나 국통이 담겨 있을 경우 두 손으로 꼭 쥐어 쏟지 않도록 한다."],[0,1,"출입문 안전수칙으로 옳지 않은 것은?",["교실 출입문이나 건물 현관문에 매달리거나 장난치지 않는다.","문을 열고 닫을 때는 주변을 확인할 필요가 없다.","문을 너무 세게 닫지 않는다.","문을 밀어 열 때는 천천히 연다."],1,"문을 열고 닫을 때는 뒷사람이 있는 확인한다."],[0,1,"운동장에서의 안전수칙 중 틀린 것은?",["축구골대를 친구들과 함께 옮긴다.","운동장에 있는 놀이기구의 사용법을 충분히 익힌다.","친구들에게 운동장의 모래, 흙을 뿌리지 않는다.","운동장에 유리조각, 쇳조각이 있을 수 있으므로 맨발로 놀지 않는다."],0,""],[0,1,"다음 중 운동 사고와 상해의 종류에 따른 올바른 처치 방법이 아닌 것은 무엇일까요?",["타박상 - 찬물 찜질을 하거나 연고를 바르고 압박붕대를 한다.","출혈 - 출혈이 심한 경우 몸을 차갑게 하여 출혈을 막는다.","염좌 - 다친 부분을 높여주고 찬 물수건으로 부기를 덜어준다.","골절 - 부러진 부분은 건드리지 말고 부목을 대어 움직이지 않도록 한 후 병원으로 옮긴다."],1,""],[0,1,"자동문 안전수칙으로 옳지 않은 것은?",["자동문 사이에 멈추고 좌우 확인 후 통과한다.","문이 열린 것을 확인한 후 통과한다.","열려 있는 자동문을 향해 뛰어 들어가지 않는다.","자동문 주변에서 놀지 않는다."],0,"자동문 사이에 멈추지 않고 바로 통과한다."],[0,1,"전기 안전수칙으로 옳지 않은 것은?",["젖은 손으로 전기기구를 만지지 않는다.","전기기구를 문어발식으로 사용하지 말아야 한다.","콘센트에 완전히 접속하고, 뽑을 때에는 아무렇게 뽑아도 된다.","불량 전기기구를 사용하지 않는다."],2,"코드를 뽑을 때에는 전선을 잡아당기면 피복 안의 구리선이 끊어져 화재와 감전사고의 위험이 있으므로 반드시 플러그를 잡고 뽑아야 한다."],[0,1,"가스 누출 시 안전대책으로 옳지 않은 것은?",["가스누출이 발견되면 즉시 연소기 코크와 중간밸브를 잠가야 하며 용기의 밸브도 차단한다.","창문을 열어 환기를 시키시고 바닥에 남아있는 가스(LPG)는 방치해도 된다. 비나 방석으 로 쓸어야 한다.","누출된 가스가 폭발할 우려가 있으므로 주변에 라이터불, 버너 등 점화원을 제거한다.","환풍기, 선풍기 등 전기기구 스위치를 끄거나 켜면 스파크가 발생하여 폭발이 일어날 가능 성이 높기 때문에 특히 유의해야 하며 즉시 가스판매소나 도시가스 지역관리소에 연락하여 안 전조치를 받는다."],1,"창문을 열어 환기를 시키시고 바닥에 남아있는 가스(LPG)는 비나 방석으로 쓸어야 한다."],[0,1,"가정 내의 가스 안전 점검 방법으로 옳지 않은 것은?",["가스 불을 사용할 때에는 창문을 열어 신선한 공기로 충분히 실내를 환기시킨다.","가스레인지 주위에는 가연성 물질(빨래, 스프레이 통 등)을 가까이 두어도 된다.","비눗물이나 세제의 거품으로 가스기구와 호스의 연결부분을 수시로 점검하여 누설 여부를 살핀다.","가스레인지는 항상 깨끗이 청소하여 버너가 막히지 않도록 한다."],1,"가스레인지 주위에는 가연성 물질(빨래, 스프레이 통 등)을 가까이 두지 않도록 한다."],[0,1,"휴대용 가스레인지 사용 방법으로 옳지 않은 것은?",["실내에서 사용해도 된다.","바닥이 삼발이 보다 큰 냄비는 사용하지 않는다.","2대의 레인지 위에 1개의 철판을 얹는 등 가스용기에 열이 가지 않도록 한다.","용기를 결합할 때 가이드와 용기의 접속 표시부가 일치하도록 한다."],0,"실내에서는 사용하지 않는다."],[0,1,"공연장 입ㆍ퇴장 시 안전수칙으로 옳지 않은 것은?",["공연장 입장 시 뛰거나 앞사람을 밀면 안전사고의 원인이 되므로 걸어서 입장하고, 질서를 우선적으로 생각한다.","관람객은 진․출입 시 안전관리원의 안내를 받아 통제선을 잘 지켜 질서 있게 이동하고, 이 동통로와 출입문을 이용하여 입․퇴장한다.","관람객은 공연시간 상관없이 입장 및 퇴장을 할 수 있다.","공연 시작 전 주최자 및 시설물 운영자는 관람객에게 입장절차, 비상상황 시 요령 등을 충 분히 알려야 하며, 관람객은 유의 사항을 잘 듣고 위급상황 시 협조하여야 한다."],2,"관람객은 공연시간을 사전에 확인한 후 입장 및 퇴장을 하여 공연시간을 잘 지켜야 한다."],[0,1,"공연장 관람 시 안전수칙으로 옳지 않은 것은?",["공연장에서 음주 및 흡연을 할 수 있다.","공연장 내에서 관람객이 큰 소리를 지르거나 옆 사람과 장난을 해서는 안 되며, 특히 어린 이와 함께 공연을 관람하는 경우에는 더 주의가 요구된다.","관람석이 아닌 곳에 앉지 않으며, 옥상, 가로수, 담벼락 등에 올라가 관람하지 않는다.","공연 주최자의 안내에 따라 행동하여 공연이 잘 진행될 수 있도록 협조해야 한다."],0,"공연장에서는 음주 및 흡연을 할 수 없다."],[0,1,"목공용 공구를 안전하게 사용하는 방법으로 옳지 않은 것은?",["작업하기 좋은 장소로 이동한다.","공구로 장난을 하지 않는다.","사전 연습 후 작업한다.","수시로 주변을 정리 정돈한다."],2,"사전에 안전 지도를 충분히 받아야 한다."],[0,1,"구기운동 시 주의사항으로 야구에 대한 설명으로 옳지 않은 것은?",["시선을 공에 두지 않아도 된다.","방망이를 들고 장난을 하거나 공이 아닌 돌이나 다른 물체를 맞춰 날려 보내지 않는다.","보호 장구를 착용하고 안전거리를 확보 한다.","지나가는 사람이 있을 때에는 공을 던지거나 치지 않는다."],0,"야구운동 중에는 공에 항상 시선을 집중해야 한다."],[0,1,"구기운동 시 주의사항으로 배드민턴에 대한 설명으로 옳지 않은 것은?",["주변에 사람이 많은 곳에서 실시한다.","라켓을 휘두르는 장난을 하지 않는다.","라켓으로 셔틀콕이 아닌 다른 물체를 쳐서 던지지 않는다.","셔틀콕만 보고 따라가다 주변 물체와 부딪히지 않도록 주의한다."],0,"주변에 사람이 많은 곳은 피한다."],[0,1,"캠핑 안전수칙 옳지 않은 것은?",["가스폭발 사고 유의","날씨가 추운 경우 텐트 내 난로 및 온열기를 사용해도 된다.","화로 불씨 주의","텐트 고정 줄에 걸리지 않도록 조심"],1,"텐트 내 난로 및 온열기 사용은 화재의 위험이 있어 절대로 사용하지 않는다."],[0,1,"산행 시 안전수칙으로 옳지 않은 것은?",["산행은 아침 일찍 시작하여 해지기 한두 시간 전에 마친다.","하루 8시간을 산행하고, 체력의 30%는 비축한다.","일행 중 약한 사람을 기준으로 산행한다.","될 수 있으면 50킬로그램 이상의 짐을 지지 않는다."],3,"산행 시 될 수 있으면 30킬로그램 이상의 짐을 지지 않는다."],[0,1,"바퀴 있는 놀이기구를 안전하게 타는 방법으로 볼 수 없는 것은?",["보호 장구 착용","안전한 장소에서 타기","밤에 타지 않기","차 뒤에 따라가기"],3,""],[0,1,"놀이 스포츠가 사고를 부추기는 원인으로 옳지 않은 것은?",["헬멧과 보호 장구를 착용하지 않고 킥보드, 자전거, 인라인 등 바퀴 달린 놀이기구를 타는 행위","몸 크기에 맞지 않는 놀이기구를 타는 행위","단정하지 못한 옷차림","낮에 바퀴달린 놀이기구를 타는 행위"],3,"놀이 스포츠가 사고를 부추기는 원인 6가지 1. 헬멧과 보호장구를 착용하지 않고 킥보드, 자전거, 인라인 등 바퀴달린 놀이기구를 타는 행위 2. 몸 크기에 맞지 않는 놀이기구를 타는 행위 3. 단정하지 못한 옷차림 4. 밤에 바퀴달린 놀이기구를 타는 행위 5. 10세 이하의 어린이가 차도에서 바퀴 달린 놀이기구를 타는 행위 6. "],[0,1,"물놀이 중 다른 사람이 물에 빠졌을 때의 행동으로 옳지 않은 것은?",["즉시 큰 소리로 인명구조요원과 어른에게 알리고 119에 신고합니다.","물에 빠진 친구를 구하기 위해 물에 뛰어든다.","레스큐 튜브, 구명조끼 등을 던져줍니다. 튜브가 없는 경우, 윗도리, 바지, 넥타이 등을 묶 어 하나의 줄 형태로 묶습니다. 주변에 음료수 PET병이나 물에 뜰 수 있는 슬리퍼를 끝에 묶 어서 던져주면 잡고 나오기가 쉽습니다.","물에 빠진 사람을 구조한 뒤에는 체온이 떨어지지 않도록 젖은 옷을 벗기고 옷이나 수건 등으로 몸을 따뜻하게 감싼 후 마사지 해 줍니다."],1,"물에 빠진 친구를 구하려고 함부로 물에 뛰어들지 않습니다. 인명 구조 자격이 있는 사람만 수영으로 구조합니다."],[0,1,"실험실 사고의 주요 유형 4가지가 아닌 것은?",["화재","폭발","화상","염좌"],3,"실험실 사고의 네 가지 주요 유형은 화재, 폭발, 중독, 화상 이다."],[0,1,"선박 사고 발생 대비 방법으로 옳지 않은 것은?",["구명조끼가 어디에 있는지 확인한다.","화재가 발생하면 소화기로 불을 끄고 유리창을 깨서 환기를 시킨다.","위험한 상황일 경우 구명조끼를 입고 물속에서 행동하기 쉽도록 신발을 신는다.","승무원의 안내에 따라 질서를 유지하며 침착하게 탈출한다.","음주자는 소형선박을 이용해서는 안 된다."],2,""],[0,1,"교통사고 발생 시 행동요령으로 옳지 않은 것은?",["위험물질 수송차량 사고 시 사고지점에서 빠져나와 대피한다.","화재가 발생하였을 때 외에는 부상자를 건드리지 않는다.","구조대의 활동이 본격적으로 시작되면 구조에 참여하지 말고 사고 현장에서 물러난다.","사고현장에서는 유류나 가스가 누출되어 화재가 발생할 위험성이 있으니 담배를 피우지 않도록 한다.","사고현장에 최대한 가까이 다가가서 지켜보면서 호기심을 가지고 오랫동안 머물러 있는다."],4,""],[0,1,"다음은 에스컬레이터 안전이용문화에 관한 것이다. 옳은 행동요령은?",["노약자의 무거운 짐을 보고 못 본척한다.","쓰레기를 남몰래 버린다.","에스컬레이터 이용 중에 앞사람을 추월한다.","에스컬레이터를 타고 내릴 때 질서를 생각하지 않고 빨리 행동한다.","동전, 열쇠 등은 떨어뜨리지 않도록 가방이나 주머니에 넣도록 한다."],4,""],[0,1,"다음 중 과학수업 안전수칙으로 옳지 않은 것은?",["실험을 할 때에는 실험복을 입고 필요한 경우 마스크와 고무장갑을 착용한다.","시약을 조제하여 보관할 때에는 나만 아는 기호로 이름표를 붙인다.","시험관을 가열할 때에는 시험관의 주둥이가 다른 사람을 향하게 해서는 안 된다.","유리로 된 실험 도구가 깨질 경우 다칠 염려가 많으므로 특별히 주의한다.","알코올 램프가 엎질러져 불이 나면 모래를 뿌린다."],1,""],[0,1,"다음 중 체육수업 안전수칙으로 옳지 않은 것은?",["운동을 하기 전에는 충분한 준비 운동을 한다.","오래 달리기를 할 때에 힘이 들면 걷기와 달리기를 반복하도록 한다.","선천적으로 허약하거나 질병이 있는 경우 미리 선생님께 말씀 드리도록 한다.","매트 및 뜀틀 운동을 할 때에는 앞 사람이 뛰자마자 바로 뛴다.","충분히 공간을 두고 활동하며, 철봉 주위에서 장난치지 않도록 한다."],3,""],[0,1,"다음 중 미술수업 안전수칙으로 옳지 않은 것은?",["미술 도구나 용품을 바닥에 떨어뜨리거나 흘리지 않는다.","미술 도구나 재료를 입에 넣지 않는다.","모든 도구와 재료는 자기 자리에서 정돈해 가며 사용하고, 자리 주변을 어질러 놓아 지나가는 친구들이 날카로운 것에 찔리거나 걸려 넘어지는 일이 없도록 한다.","가위, 칼 스테이플러, 펀치 등의 도구를 사용할 때에는 힘을 주어 사용하도록 한다.","종이에 손이 베지 않도록 주의한다."],3,""],[0,1,"다음 중 교실 내 안전수칙으로 옳지 않은 것은?",["쉬는 시간에 교실에서 뛰지 않는다.","청소 시간에 비치된 가구나 청소 도구로 장난치지 않는다.","교실 앞뒤에 부착되어 있는 게시물을 내 주관대로 떼어 낸다.","창틀에 올라가서 밖을 보거나, 윗몸을 많이 밖으로 내밀거나 또는 창틀에 기대어 앉는 행위를 하지 않는다.","창문 밖으로 물체를 던지지 않는다."],2,""],[0,1,"다음 중 복도 및 계단에서 안전수칙으로 옳지 않은 것은?",["비나 눈이 오는 날에 복도나 계단이 미끄러우므로 조심한다.","복도나 계단에서는 한쪽으로 통행을 하며, 천천히 걸어서 다른 사람의 활동을 방해하지 않도록 주의한다.","학급 단위로 또는 여러 사람이 함께 계단 이동 시 앞뒤 사람과 충분한 거리를 두고 이동하도록 한다.","계단을 오르내릴 때에는 난간을 잡고 이동한다.","계단에서는 두 칸씩 이동한다."],4,""],[0,1,"다음 중 운동장에서 안전수칙으로 옳지 않은 것은?",["야구나 축구 경기를 할 때 다른 사람에게 피해를 주지 않아야 하며, 서로 부딪혀 다치는 경우를 예방하기 위해 경기 규칙을 잘 지키도록 한다.","공이 담을 넘어가면 공을 찾기 위해 담을 넘거나 차도로 가도록 한다.","운동장 바닥에 있는 운동 기구나 공 등에 걸려 넘어지지 않도록 자기 주변을 확인한다.","친구들에게 운동자의 모래나 흙을 뿌리지 않는다.","운동장에 비치된 놀이 기구들의 사용 방법을 바르게 익혀 안전하게 이용한다."],1,""],[0,1,"가정에서 쓰는 전기제품 중 대기전력 소모가 가장 큰 제품은 무엇일까요?",["세탁기","TV","TV 셋톱박스","냉장고"],2,"위성․디지털방송 신호 수신기인 셋톱박스는 디지털로 압축되어 전송되는 위성신호나 케이블방송 신호를 받아 tv에서 인식할 수 있는 신호로 변환하는 장치입니다. 이때 대기상태에서도 항상 입력되는 신호를 변환해야 하기 때문에 전력소모가 매우 높답니다."],[0,1,"버스 안의 승객들이 어떤 행동을 하는 순간 가장 많은 사고가 일어날까요?",["승차 시 계단에 발을 디딜 때","교통 카드를 찍을 때","하차 전 벨을 누르려고 이동할 때","서서 휴대전화로 통화를 할 때"],2,"우리 가족과 이웃의 발이 되어 주는 버스. 하지만 버스 안에서는 하는 작은 행동 하나가 큰 부상으로 이어질 수 있습니다. 그 중 가장 많은 사고를 일으키는 행동은 바로 하차 전 벨을 누르려고 이동하는 것입니다. "],[0,1,"독일에서는“당신의 자녀가 교통사고를 당할까 불안하다면 당장 3가지 습관을 길러줘라”라는 교통안전 홍보를 합니다. 다음 중 3가지 습관이 아닌 것은?",["우선 멈추는 습관","운전자와 눈 맞추는 습관","항상 차를 주시하며 건너는 습관","무단횡단하지 않는 습관"],3,""],[0,1,"안전사고 5만 건을 분석한 미국의 안전 전문가 하인리히가 사고의 피라미드 모형으로 사고 날 뻔한 상황 ( )건이면 실제 경상해가 ( )건이 발생하고, 중상 또는 사망이 ( )건이 발생한다는 연구 결과를 발표했다. ( )안에 들어갈 알맞은 숫자는?",["200, 10, 1","300, 15, 1","300, 29, 1","300, 39, 1"],2,""],[0,1,"각 주마다 약간씩 차이가 있으나 1920년부터 안전교육을 법률로 의무화하여 안전교육을 철저히 실시하고 있는 나라는?",["영국","캐나다","미국","오스트레일리아"],  떨어질 수 있는 물건은 미리 치워둡니다.","비상시를 대비해 응급처치법을 알아둡니다.","지진 후 가족을 다시 만날 수 있는 장소와 연락방법을 미리 결정해 둡니다.","전열기, 가스기구 등을 쉽게 옮길 수 있도록 느슨하게 둡니다."],3,"전열기, 가스기구 등은 쉽게 넘어지지 않도록 단단히 고정해둡니다. 그리고 평소에 전기배선, 가스 등을 점검하고 불안전한 부분을 수리해둡니다."],[0,3,"지진으로 화재가 발생 시 적절한 조치 방법은 무엇입니까?",["작은 흔들림이 시작되면 사용 중인 가스레인지나 난로 등의 불을 신속히 끕니다.","화재가 발생했다면 소방차가 올 때까지 기다립니다.","화재가 발생했다면 욕실에 들어가 문을 닫고 구조를 기다립니다.","서둘러 밖으로 뛰어나갑니다."],0,"크게 흔들리기 전, 작은 흔들림이 먼저 있습니다. 이 때 사용 중인 전기나 가스기구를 신속히 끕니다. 만약 큰 흔들림이 시작된다면 즉시 테이블 밑으로 몸을 숙입니다. 지진으로 인한 화재는 신속히 대처가 가능하므로 1~2분이 지난 뒤에도 소화기로 불을 끌 수 있습니다."],[0,3,"집 밖에서 지진을 느꼈을 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["손이나 가방 등 드는 것으로 일단 머리를 보호한다.","자동판매기 옆에는 서 있지 않는다.","대문기둥이나 담에 기대어 몸을 지탱한다.","빌딩이나 건물에서 간판, 유리창 등이 떨어질 수 있음을 유념한다."],2,"땅이 크게 흔들리고 서 있을 수 없게 되면 무엇인가 기대고 싶어 하는 심리가 작용합니다. 가까이에 있는 대문기둥이나 담이 우선 그 대상이 될 것입니다. 그러나 이와 같은 것들은 언뜻 보기에는 튼튼해 보이지만 사실은 넘어지거나 무너질 수 있는 것들로 매우 위험합니다."],[0,3,"전철을 타고 가다 지진을 느꼈을 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["충격에 대비하여 양손으로 주변 사람을 꼭 붙잡습니다.","서둘러 출구로 뛰어나가는 것은 위험한 행동으로 자제합니다.","차내 방송에 따라 침착하게 행동합니다.","선반위에 올려둔 물건들이 떨어질 수 있음을 유념합니다."],0,"큰 충격이 닥쳐오므로 같이 흔들릴 수 있는 사람보다는 전철의 고정된 횡축(봉)이나 손잡이를 꼭 붙잡고 있어야 합니다."],[0,3,"자동차를 타고 가다 지진을 느꼈을 경우 대처방법으로 옳지 않은 것은 무엇일까요?",["즉시 속도를 줄이고 비상등을 켭니다.","주의를 하며 자동차를 도로의 왼쪽에 세웁니다.","자동차 라디오의 정보에 귀를 기울입니다.","대피할 필요가 있을 때는 창문은 닫고 문을 잠그지 말고 안전한 곳으로 피신합니다."],1,"자동차는 도로의 오른쪽에 세우고 통제구역에서는 운전을 금지합니다. 이는 대피하는 사람들이나 긴급차량이 통행할 수 있도록 도로의 중앙부분을 비워두기 위함입니다."],[0,3,"지진해일 발생 시 행동요령으로 옳은 것은 무엇일까요?",["신속히 저지대로 대피합니다.","해안가에서 하던 작업이나 활동을 계속합니다.","우리나라와는 큰 상관이 없으므로 개의치 않습니다.","지진해일 특보를 경청하며 지시에 따릅니다."],3,"일본 서해안에서 지진 발생 후 동해안에는 약 1~2시간 이내에 지진해일이 도달하므로 해안가에서는 작업을 중단하고, 위험물(충돌 시 충격이 큰 물건 등)을 이동시키며, 신속히 고지대로 대피하도록 합니다."],[0,3,"다음 중 지진해일에 대한 설명으로 옳지 않은 것은 무엇일까요?",["지진해일은 물이 빠지는 것으로 시작되는 일도 있고, 이때 항 바닥이 드러나기도 한다.","지진해일 도달 가능 역역은 울산, 포항 등 동해안 일부지역이다.","지진해일은 일반적으로 여러 번 도달하는데 제 1파보다 2, 3파의 크기가 더 큰 경우도 있다.","지진해일은 바다로 통해 있는 하천을 따라 역상하기도 한다."],1,"지진해일의 도달 가능 역역은 동해안 전역이고, 파고 3~4m 정도의 지진해일이 내습할 수 있습니다."],[0,3,"다음 중 폭풍해일이 발생 시 대처요령에 대한 설명으로 옳지 않은 것은 무엇일까요?",["TV나 라디오를 통한 기상상황이나 해일 니다. 최초로 사고를 목격했을 경우에는 신속히 주변에 알리거나 119에 신고합니다. 아울러 사고현장은 매우 혼란스럽기 때문에 구조대원들에게 방해가 되지 않도록 현장을 피합니다."],[0,2,"올바른 전기 사용법에 대한 설명 중 틀린 것은?",["냉방 시 실내온도와 실외온도의 차이는 10℃가 적당하다.","에어컨을 강 대신 약으로 낮추고 선풍기를 함께 가동하면 종전 소비량의 60%를 절감할 수 있다.","선풍기를 2시간 이상 사용하면 피부수분이 증발되어 위험하다.","냉장고는 뒷면 벽과 10cm 이상, 윗부분과 30cm 이상 떨어뜨려 설치하는 것이 좋다."],0,"실내온도와 실외온도는 인체적응성을 고려할 때 5℃ 이내가 적당하다."],[0,2,"다음 중 가정의 전기안전을 위한 유의 사항이 아닌 것은?",["누전차단기는 6개월에 1번 정도씩 시험 작동한다.","가전제품 구입 시 안전검사를 받은 정품을 구입한다.","취침 시 또는 집을 모두 비울 때 각종 코드는 뽑아둔다.","가전제품 위에 꽃병이나 물병을 두지 않는다."],0,"누전차단기는 월 1회 이상 이상유무를 정기적으로 점검해야한다."],[0,2,"다음 중 정전 발생 시 조치사항으로 옳지 않은 것은 무엇일까요?",["한 집만 정전인지, 전체 정전인지 확인한다.","엘리베이터 이용 중 정전 시 인터폰으로 연락하고 구조를 기다린다.","불시 정전에 대비하여 가정 내 손전등, 비상식 음료, 휴대용 라디오 등을 사전에 준비한다.","엘리베이터 이용 시 일단 탈출을 시도한다."],3,"우리 집만 정전이 되었을 경우 과부화로 인한 정전일 가능성이 높으므로 누전차단기의 이상 유무를 확인한 뒤 플러그를 뺐다가 다시 작동시키면 됩니다. 엘리베이터에서는 인터폰으로 구조요청하고 임의 탈출을 시도하지 맙시다."],[0,2,"전선이 낡아 (+)선과 (-)선이 맞닿은 상태로, 스파크와 동시에 고열이 발생하는 현상은?",["누전","합선","용량초과","과부하"],1,""],[0,2,"평상시 전기와 관련된 점검사항 중 옳지 않은 것은 무엇일까요?",["1개의 콘센트에 여러 개의 전기기구를 사용하지 않습니다.","젖은 손으로 전기기구를 만지지 않습니다.","전선의 피복이 약간 벗겨진 정도는 사용에 문제가 없습니다.","집을 비울 때는 각종 전기기구의 코드를 콘센트에서 뽑아놓습니다."],2,"손상된 코드선, 피복이 조금이라도 벗겨지거나 훼손된 전선은 사용해서는 안됩니다."],[0,2,"선박사고 발생 시 행동요령으로 올바른 것은 무엇일까요?",["창문이 열리지 않을 때는 도끼로 깨고 탈출한다.","선박의 창문은 열리지 않더라도 절대 깨서는 안된다.","나부터 먼저 구명정에 먼저 오른다.","물에 뛰어들었다면 신속하게 육지 반대방향으로 이동한다."],0,"출입문이 열리지 않을 경우에는 비치된 도끼를 이용해서 창문을 깨더라도 신속히 탈출해야 합니다."],[0,2,"다음 중 비행기 탑승 전 주의사항으로 옳지 않은 것은 무엇일까요?",["비행 전 승무원의 브리핑에 귀를 기울입니다.","기내 수화물은 유사시 신속한 탈출에 방해되지 않도록 지정된 부피와 무게를 준수합니다.","비행 중 좌석에서는 항상 안전벨트를 착용합니다.","비행 중 지겨울 경우 좌석을 옮겨 다닙니다."],3,"출발 전 배정된 좌석에 착석합니다. 그리고 배정된 좌석을 마음대로 변경하고 이동하는 것은 항공기의 비행에 문제를 일으킬 수 있습니다."],[0,2,"다음 중 비행기 탑승 중 비상상황 발생 시 대처요령으로 옳지 않은 것은 무엇일까요?",["승무원의 안내보다는 나의 직감에 따라 행동합니다.","충돌 전 좌석등받이를 앞으로 세웁니다.","몸을 앞으로 숙입니다.","비상탈출용 슬라이드 이용 시 굽이 높은 구두나 모서리가 날카로운 장신구와 소지품을 기내에 남겨두고 탈출합니다."],0,"상황발생 시 반드시 승무원의 안내에 따라야 합니다. 충돌 전 좌석등받이를 앞으로 세우고 안전벨트를 착용한 후 부상을 최소화할 수 있도록 몸을 앞으로 숙입니다. 구두나 날카로운 소지품으로 비상탈출용 슬라이드가 찢어질 수 있으니 이런 것들은 기내에 남겨두고 탈출  생활해야 하고 절대 외부의 물이나 음식 등을 함부로 섭취해서는 안됩니다."],[0,2,"댐 붕괴 발생 시 관련정보를 알려주는 기관이 아닌 것은 어느 것일까요?",["산림자원공사","댐 관리기관","지자체","소방방재청"],0,"댐 관리기관에서는 댐 직하류 경보방송을 실시하고, 지자체에서는 방송사 및 언론사를 통한 재난방송을 송출하며 소방방재청에서는 대국민 재난온라인방송 및 재난문자서비스를 제공합니다. 산림자원공사는 댐 붕괴와 직접적인 관련이 있는 기관이 아닙니다."],[0,0,"산업현장 4대 필수 안전수칙으로 옳지 않은 것은?",["안전보건교육 실시","보호구 지급・착용","안전작업절차 지키기","행동지침 부착"],3,"① 안전보건교육 실시: 겉치레식 교육이 아닌 실질적인 안전보건교육이 이루어지고 근로 자들이 이를 완전히 숙지한 상태에서 작업을 할 수 있도록 한다. ② 보호구 지급・착용: 여름철에 덥고 귀찮더라고 보호구 착용을 철저히 하여 불의의 사고 에 내 몸을 지키도록 한다. ③ 안전작업절차 지키기: 안전작업절차에 따라 순서대로 작업한다. "],[0,0,"안전보건표지판의 종류로 어떤 특정한 행위가 허용되지 않음을 나타내며, 흰 바탕에 빨간색과 45°각도의 빗선으로 이루어진 표지판은?",["금지표지","경고표지","전달표지","안내표지"],0,"금지표지 - 어떤 특정한 행위가 허용되지 않음을 나타낸다. 이 표지는 흰 바탕에 빨간색과 45°각도의 빗선으로 이루어진다. 금지할 내용은 원의 중앙에 검정색으로 표현하며, 둥근 태와 빗선의 굵기는 원외경의 10%이다. 주로 위험한 행동의 금지에 사용되는데 출입 금지, 보행 금지 등에 쓰인다."],[0,3,"홍수 예·경보 시 대비요령으로 옳지 않은 것은?",["피해가 예상되는 지역 주민은 대피 준비를 하고 물이 집안으로 흘러가는 것을 막기 위한 모래주머니나 튜브 등을 준비한다.","홍수피해가 예상되는 지역의 주민은 라디오나 TV, 인터넷, 스마트폰 등을 통해 기상변화를 알아둔다.","홍수 우려 때 피난 가능한 장소와 길을 미리 알아둔다.","비탈면이나 산사태가 일어날 수 있는 지역으로 이동한다."],3,"비탈면이나 산사태가 일어날 수 있는 지역에 가까이 가지 않는다."],[0,3,"산사태 징후가 있는 때는 현상으로 옳지 않은 것은?",["경사면에서 갑자기 많은 양의 물이 샘솟을 때","평소처럼 샘물이나 지하수가 잘 나올 때","갑자기 산허리의 일부가 금이 가거나 내려앉을 때","바람이 불지 않는데도 나무가 흔들리거나 넘어지는 때, 산울림이나 땅울림이 들릴 때"],1,"① 경사면에서 갑자기 많은 양의 물이 샘솟을 때 - 이때는 땅속에 과포화 된 지하수가 있다는 것을 나타내므로 산사태의 위험이 커진다. ② 평소 잘 나오던 샘물이나 지하수가 갑자기 멈출 때 - 이때는 산 위의 지하수가 통과하는 토양층에 이상이 발생한것을 나타내므로 위험이 많다고 볼 수 있다. "],[0,3,"번개를 본 후 몇 초 이내에 천둥소리를 들었다면 신속히 안전한 장소로 대피하여야 하는가?",["10초","20초","30초","40초"],2,"번개를 본 후 30초 이내에 천둥소리를 들었다면 신속히 안전한 장소로 대피한다. (약 10㎞이내에 뇌전 발생)"],[0,3,"폭발 대비요령 옳지 않은 것은?",["누출된 가스가 폭발할 우려가 있으므로 주변에 라이터불, 버너 등 점화원을 제거한다.","가연성가스 등이 체류하지 않도록 창문 등을 열어 환기한다.","가스에 의해 눈이 따가울 경우에는 손으로 닦는다.","가스누출이 발견되면 즉시 연소기 코크와 중간밸브를 잠가야 하며 용기의 밸브도 차단한다."],2,"가스에 의해 눈이 따가울 경우에는 깨끗한 물로 씻어야 한다."],[0,3,"화재의 발생원인 중 물이나 나무, 기름 탱크에 떨어지는 벼락에 의해서 일어나는 화재를 무엇이라 하는가?",["전기화재","유류화재","가재화재","낙뢰에 의한 화재"],3,"낙뢰에 의한 화재: 건물이나 나무, 기름 탱크에 떨어지는 벼락에 의해서 일어나는 화재"],[0,3,"화재 발생 시 기본 대피방법으로 옳지 않은 것은?",["불을 발견하면‘불이야’하고 큰 소리로 외쳐서 다른 사람에게 알린다.","엘리베이터는 절대 이용하지 않도록 하며 계단을 이용한다.","높은 자세로 안내원의 안내를 따라 대피한다.","아래층으로 대피가 불가능한 때에는 옥상으로 대피한다."],2,"낮은 자세로 안내원의 안내를 따라 대피한다."],[0,3,"테러의 종류 중 액체, 기체, 고체상태의 독성화학물질을 살포하여 유발하는 테러를 무엇이라 하는가?",["항공테러","열차테러","화학테러","생물테러"],2,""],[0,3,"생화학테러 대처요령 옳지 않은 것은?",["화학사고가 발생한 경우 가능한 우의나 비닐로 직접 피부가 노출되지 않도록 하고, 수건, 마스크 등을 이용하여 코, 입을 감싸고 최대한 멀리 대피해야 합니다.","화학사고로 발생한 독성 가스는 대부분 공기보다 가볍기 때문에 낮은 곳으로 대피해야 하 며, 관계기관이 제공하는 정보에 따라 움직이는 것이 안전합니다.","대피 시 바람을 안고 이동해야 합니다. 만약, 대피하려고 하는 방향에서 가스가 날아오는 경우에는 바람이 불어오는 방향의 직각방향으로 이동해야 합니다.","실내로 대피한 경우에는 창문 등을 닫고, 외부공기와 통하는 설비(에어컨, 환풍기 등)의 작 동은 중단해야 합니다."],1,"화학사고로 발생한 독성 가스는 대부분 공기보다 무겁기 때문에 높은 곳으로 대피해야 하며, 관계기관이 제공하는 정보에 따라 움직이는 것이 안전합니다."],[0,3,"화재의 종류 중 발화물을 중심으로 했을 때 마그네슘, 티타늄, 지르코늄, 나트륨, 칼륨 등 가연성의 금속 화재는 몇 급 화재에 해당하는가?",["A급 화재","B급 화재","C급 화재","D급 화재"],3,"A급 화재 : 나무, 종이, 섬유류, 플라스틱 등 일반 가연물의 화재로 타고 나서 재가 남는 화재 B급 화재 : 휘발유 또는 석유와 같이 불에 타기 쉬운 가연성 액체 또는 프로판 가스와 같은 가연성 가스류 화재 C급 화재 : 변압기, 전기다리미, 거푸집 등 전기를 통한 상태의 전기 기기에서 일어난 화재 D급 화재 : 마그네슘, 티타늄, 지…"],[0,3,"아파트에서 화재가 발생한 경우 대처 요령으로 옳지 않은 것은?",["먼저 화재 상황을 신속히 파악하고 침착하게 화재 발생을 가족과 이웃에게 알린다.","침착하게 불이 난 건물의 위치, 건물 개요(동, 호수), 화재의 상태, 갇힌 사람의 유무 등을 117로 신고한다.","화재의 발견이 늦었거나 초기 소화 작업이 곤란할 정도로 불이 번진 경우 젖은 수건 등으 로 코와 입을 막은 후 낮은 자세로 대피한다.","아파트 계단에 연기가 가득하여 대피가 곤란한 경우에는 베란다에 설치된 비상탈출구(경량 칸막이)를 파괴 후 옆집 세대로 대피한다."],1,"화재발생 신고는 119이다."],[0,3,"건물이나 집에 연기가 들어올 경우 대처 요령 방법으로 옳지 않은 것은?",["방안으로 연기가 들어오지 못하도록 문틈을 옷이나 커튼, 이불 등으로 막는다. (이때, 물을 적시면 더욱 좋다.)","주위에 물이 있으면 옷에 물을 적셔 코와 입을 젖은 수건 등으로 막아 연기가 폐에 들어가 지 않도록 한다.","불길 속을 통과할 때에는 빠르게 달려 통과 한다.","연기가 많은 곳에서는 팔과 무릎으로 기어서 이동하되 배를 바닥에 대고 가지 않도록 한다."],2,"불길 속을 통과할 때에도 물에 적신 담요나 수건 등으로 몸과 얼굴을 감싸준다."],[0,3,"불(연소)의 3 요소에 해당하는 것은?",["연료, 열, 산소","연료, 열, 이산화탄소","연료, 열, 탄산","열, 산소, 질소"],0,"불은 연료(가연물), 열(점화원), 산소 등을 \"불의 3요소\"라 한다."],[0,3,"일반 소화기 사용 방법으로 옳지 않은 것은?",["소화기를 불이 난 곳으로 옮긴다.","손잡이 부분의 안전핀을 뽑는다.","바람을 정면으로 마지며 서서 호스를 불쪽으로 향하게 한다.","손잡이를 힘껏 움켜쥐고 빗자루로 쓸 듯이 뿌린다."],2,"바람을 등지고 서서 호스를 불 쪽으로 향하게 하여야 한다. 불길이 자신에게 오는 것을 막을 수 있다."],[0,3,"붕괴의 징후로 옳지 않은 것은?",["시설물 주변의 축대나 옹벽 : 침하 및 기울어짐, 균열 또는 배부름 등의 변형, 축대 위 흙의 침하와 침수, 배수 구멍의 막힘","시설물 불균등 침하 : 시설물이 기울어지고 벽에 균열이 생김, 지반의 부분 침하 및 융기, 창과 문의 뒤틀림, 또는 여닫기가 곤란함","구조적 균열과 변형 : 슬래브 상하부에 균열과 변형, 기둥의 상, 하부나 중앙에 규칙적인 균열의 집중, 피복 콘크리트의 터짐과 철근 노출 등","철재의 표면이 도색이 잘 안 되어 있는 경우"],3,"① 시설물 주변의 축대나 옹벽 : 침하 및 기울어짐, 균열 또는 배부름 등의 변형, 축대 위 흙의 침하와 침수, 배수 구멍의 막힘 ② 시설물 불균등 침하 : 시설물이 기울어지고 벽에 균열이 생김, 지반의 부분 침하 및 융 기, 창과 문의 뒤틀림, 또는 여닫기가 곤란함 ③ 구조적 균열과 변형 : 슬래브 상하부에 균열과 변형, 기둥의 상, 하…"],[0,3,"건물이 무너져 갇혔을 때 구조 요청 방법으로 국제적으로 통일된 구조 요청 신호에 해당하는 것은?",["1분에 6회 짧게 신호 → 1분 쉬고 → 1분에 6회 짧게 신호(반복)","1분에 7회 짧게 신호 → 1분 쉬고 → 1분에 7회 짧게 신호(반복)","1분에 8회 짧게 신호 → 1분 쉬고 → 1분에 8회 짧게 신호(반복)","1분에 9회 짧게 신호 → 1분 쉬고 → 1분에 9회 짧게 신호(반복)"],0,"- 국제적으로 통일된 구조 요청 신호 : 1분에 6회 짧게 신호 → 1분 쉬고 → 1분에 6회 짧게 신호(반복) - 국제적으로 통일된 구조 응답 신호 : 1분에 3회 길게 신호 → 1분 쉬고 → 1분에 3회 길게 신호(반복)"],[0,3,"인질 상황 발생 시 대응 요령으로 옳지 않은 것은?",["납치 후 처음 15-45분이 가장 위험한 시기이며, 납치의 초기 단계에서의 납치범들은 감정 적으로 매우 격하고 위험한 상태에 있음을 감안해야 한다.","가능한 빨리 자신의 감정을 통제하여 놀라거나 자제력을 잃지 않고 침착하게 행동하여, 눈 에 띄는 행동은 자제한다.","납치범의 신경을 건드리지 않기 위해 휴대폰을 꺼둔다.","반항적인 행동은 납치범으로부터 폭력적인 반응을 가져올 수 있음을 감안, 말을 되받아치거 나 거칠게 행동하는 것은 자제한다."],2,"휴대폰을 켜두면 위치 추적이 가능하여 구출 활동에 크게 유용하기 때문에 반드시 전원을 켜두고 있는다."],[0,3,"해외여행 시 여권 도난/분실 시 행동 요령으로 옳지 않은 것은?",["여권을 도난/분실했을 경우, 즉시 재외 공관(대사관, 영사관)에 신고한다.","여권을 재발급 받거나 여행증명서를 발급받아야 한다.","중국에서는 여행증명서 외에 중국 공안당국이 발행한 여권 분실 증명서가 있어야 출국이 가능하므로 반드시 중국 공안당국으로부터 여권 분실 증명서를 발급 받도록 한다.","분실 신고된 여권은 나중에 되찾았을 경우에도 재사용 가능하다."],3,"분실 신고된 여권은 즉시 무효가 되며, 나중에 되찾았을 경우에도 재사용이 불가하고 이미 받아놓은 비자도 효력을 잃게 된다."],[0,3,"감전의 위험이 있어 전철에 가지고 타면 안 되는 물건은 무엇일까요?",["알루미늄 배트","막대 풍선","잠자리채","물총"],2,"우리가 자주 이용하는 전철에는 무려 2만 5천 볼트의 고압 전류가 흐르고 있습니다. 전선은 높은 천장에 있기 때문에 평소에는 우리 몸에 닿지 않지만 손에 들고 있던 물건이 닿으면 감전이 될 수 있습니다. 고압 전류에 감전이 되면 대부분 심장마비로 즉사하며, 살아남더라도 온몸에 전기 화상을 입을 수 있습니다. "],[0,3,"건물 전체가 화염에 뒤엎었던 9.11사고. 생존자들이 건물 내에서 대피할 수 있던 방법은 무엇이었을까요?",["옥상으로 올라가 헬기로 구조되었다.","화물용 엘리베이터로 탈출했다.","수건으로 호흡기를 가리고 구조될 때까지 기다렸다.","방화문을 닫고 비상계단으로 탈출했다."],3,"고층건물 전체가 연기와 불꽃에 휩싸였던 9.11 사고에서 많은 사람들이 무사히 빠져나올 수 있었던 것은 연기가 퍼지지 않은 비상계단을  또는 동물의 피부, 점막에 널리 분포한 식중독균, 노로바이러스는 사람의 분변에 오염된 물이나 식품 등으로 겨울철에 많이 발생하는 식중독균, O157는 환자나 동물의 분변에 직·간접적으로 오염된 식품에서 걸리며 고위험 식중독 균이다."],[0,5,"눈으로 볼 수 있는 빛의 종류는 무엇인가?",["적외선","가시광선","자외선","X-선"],1,"눈으로 볼 수 있는 빛의 종류는 가시광선이며 붉은색보다 긴 파장이 적외선 파랑색보다 짧은 파장이 자외선이다."],[0,5,"우리나라 정부기관 중 식품 및 의약품의 안전 관리를 맡고 있는 기관은?",["국민안전처","보건복지부","식품의약품안전처","소방청"],2,"식품의약품안전처에서는 국내 유통 및 수입 되는 식품, 건강기능식품, 의약품, 의약외품, 화장품, 의료기기 등에 대해 전반적인 안전관리를 총괄하고 있다."],[0,5,"식품의 농약 잔류허용기준은 동물 실험 등 다양한 실험으로 인간에게 안전한 수치를 구하 고 있다. 이때 동물과 인간과의 차이를 감안하기 위해 안전계수를 두고 있는데 얼마인가?",["1배","10 ~ 100배","100 ~ 1000배","1000배 이상"],1,""],[0,5,"다음 중 안전한 식품을 위해 위생관리를 하고 있는 단계가 아닌 것은?",["제조","유통","소비","소화"],3,"식품의 안전관리는 생육, 생산, 제조, 유통, 소비과정 전반에 걸쳐서 이루어지고 있다."],[0,5,"식품으로 인한 건강장해의 생성요인별 분류 중 외부에서 식품에 침투되는 것을 외인성이 라고 한다. 다음 중 외인성 병인물질이 아닌 것은?",["잔류농약","환경오염 물질(예 PCB)","복어독","불허용 식품첨가물"],2,""],[0,5,"농약은 다음 중 여러 가지 특징을 가지고 있어 사용량 및 잔류량을 규제하고 있다. 그 특 징에 해당되지 않는 것은?",["급성독성","생산성","난분해성","만성독성"],1,""],[0,5,"식품의 안전성을 확보하기 위해 위해요소를 중점 관리하는 제도는?",["HACCP","NASA","MRL","CODEX"],0,"HACCP는 hazard analysis critical control point의 약칭으로 식품 등 제조업 등 여러 분야에서 위해요소를 관리하여 안전한 먹거리를 제공하는 제도이다."],[0,5,"식품 중 영양성분 및 유해물질 등을 분석하기 위해 여러 가지 첨단분석장비를 이용하는데 그 중 빛을 이용한 분석기기가 아닌 것은?",["HPLC-PDA(photodiode array)","Spectrophotometer","IR(Infrared Ray)","GC-MS"],3,"GC-MS는 빛의 원리가 아닌 이온화 된 분자의 질량을 측정하는 분석장비 이다."],[0,5,"약산의 그 염의 혼합용액 또는 약염기와 그 염의 혼합용액에 소량의 산, 알칼리 또는 물을 가하여 희석하여도 용액의 pH는 거의 변화하지 않는 용액을 무엇이라 하는가?",["표준용액","완충용액","설탕용액","시험용액"],1,""],[0,5,"적당한 흡착제에 분리하려는 각 성분의 혼합물을 통과시켜서 이들이 흡착제를 따라 이동 하는 동안에 각 성분의 흡착제에 대한 성질의 차이로서 개개의 성분을 분리 검출하는 방법은 무엇인가요?",["크로마토그래피","pH","가열","건조"],0,""],[0,5,"DNA의 원하는 부분을 복제·증폭시키는 분자생물학적인 기술은?",["Deoxyribonucleic acid","PCR(Polymerase Chain Reaction)","Genome","Synthesis"],1,""],[0,5,"1940년대 일본 도야마현 신쓰강 유역 아연광산 및 제련소에서 페수를 배출된 중금속이 식수와 쌀을 오염시켜 이를 섭취한 주민들이 1965년까지 100여명이 뼈의 변형, 보행 불가능, 심한 통증 등을 유발하는 이타이이타이(itaiitai) 병으로 사망한 사건이 있었습니다. 이 원인이 된 중금속은?",["칼슘(Ca)","나트륨(Na)","마그네슘(Mg)","카드뮴(Cd)"],3,"이타이이타이병은 문맥적으로 “아프다 아프다”라는 의미의 일본어에서 유래된 것으로, 일본 도야마현의 진즈강 하류에서 발생한 대량 카드뮴 중독으로 인한 공해병을 말한다. 원인은 미쓰이 금속주식회사 광업소에서 버린 폐광석에 포함된 카드뮴이 체내에 농축된 것이었다."],[0,5,"1950년대 일본 구마모토현의 미나마타시에서 인근의 화학공장에서 바다에 방류한 폐수로 인해 OOO 중금속에 오염된 어패류를 먹은 주민들이 신경이 손상되어 사지마비나 언어장애가 일어나고 눈과 귀의 기능이 상실되는 미나마타병이 발생하였습니다. 이 원인이 된 중금속은 무 엇인가요?",["철(Fe)","수은(Hg)","칼륨(K)","마그네슘(Mg)"],1,"수은을 포함하는 폐기물에 의해 물이 오염된다. 물속의 수은폐기물은 진흙 속에 있는 세균에 의해 유기수은으로 바뀌어, 사람이 음식으로 먹는 물고기나 다른 수중생물에 농축된다."],[0,5,"황사방지용 마스크나 방역용 마스크 사용 시 올바른 방법은?",["마스크는 매번 세탁하여 사용한다.","마스크 착용 후 마스크의 겉면은 만져도 된다.","마스크 안쪽이 오염되었을 때는 사용하지 않는다.","수건·휴지 등을 사용하여 호흡기를 감싼 다음 그 위에 착용한다."],2,"황사방지용 마스크·방역용 마스크 사용 시 주의점 1. 세탁하여 사용하지 마세요. 2. 착용 후 마스크의 겉면을 만지지 마세요. 3. 수건·휴지 등을 사용하여 호흡기를 감싼 다음 그 위에 착용하지 마세요. 4. 마스크 안쪽이 오염되었을 때는 사용하지 마세요. 5. 찌그러트리거나 변형하지 마세요."],[1,5,"마스크는 재사용이 가능하다.",null,1,"현재까지 식약처에서 허가받은 황사방지용 마스크나 방역용 마스크는 모두 일회용입니다. 한번 사용하면 이미 눈에 보이지 않으나 먼지나 세균에 오염 될 수 있으므로 재사용하면 안 됩니다."],[1,5,"방역용 마스크는 세균이나 바이러스를 죽인다.",null,1,"세균이나 바이러스를 죽이는 것이 아니라 방역용 마스크에 사용되는 특수한 필터를 통해 외부의 작은 입자를 걸러 노출되는 정도를 줄여 주는 것입니다."],[0,5,"식품의약품안전처의 영문명칭 약자는 무엇일까요?",["FDA","EXID","WHO","MFDS"],3,"식품의약품안전처의 영문명은 Ministry of Food and Drugs Safety 이다."],[0,5,"다음 중 슈퍼 또는 편의점에서 구입할 수 있는 의약품(의약외품)이 아닌 것은?",["황사마스크","항생제","액상소화제","파스"],1,"항생제는 의사의 처방이 있어야 구입할 수 있는 전문의약품이다."],[0,5,"다음 중 과일과 채소 속 잔류농약의 효과적인 세척 및 섭취 방법이 올바르지 않은 것은 무엇인가요?",["포도 : 송이째 물에 1분 동안 담갔다가 흐르는 물에 잘 헹궈서 먹는다.","사과 : 물에 씻거나 헝겊 등으로 잘 닦아서 껍질째 먹는다.","딸기 : 물에 1분 동안 담근 후 흐르는 물에 30초 정도 씻은 다음 꼭지까지 먹는다.","오이 : 흐르는 물에서 오이 표면을 스펀지 등으로 문질러 씻은 다음 굵은 소금을 뿌려서 문지르고 다시 흐르는 물에 씻은 다음 먹는다."],2,"딸기의 꼭지부분은 농약 잔류 가능성이 있으므로 먹지 않고 남기도록 한다."],[0,5,"다음 중 파스 사용 시 주의사항으로 올바르지 않은 것은?",["파스를 사용하는 부위를 확인한다.","파스의 형태(액상, 에어로솔제, 피부에 붙이는 형태 등)에 따라 주의하여 사용한다.","사용하기 전에 파스에 함유된 성분을 확인한다.","증상(근육통, 가려움 등)이 개선될 때까지 계속해서 사용한다."],3,"파스는 일반적으로 원인을 치료하는 것이 아니라 증상을 치료하는 약이므로 5~6일 정도 사용해도 증상이 개선되지 않으면 사용을 중단하고 의사 또는 약사와 상의하도록 한다."],[0,5,"다음 중 같은 양이 아닌 것은?",["0.1mg/L","1000ppb","1ppm","0.0001%"],0,"1ppm = 1mg/L = 1000ppb = 0.0001%"],[0,5,"1초에 하나의 방사선이 나오는 세기를 나타내는 국제 표준 단위는?",["라디안(rad)","베크렐(Bq)","킬로그램(Kg)","헤르츠(Hz)"],1,"베크렐(Bq)은 1초당 1개의 방사선이 방출됨을 의미한다. ① 평면각 단위 ② 방사능 단위 ③ 질량 단위 ④ 주파수 단위"],[0,5,"다음 중 방사선에 대한 설명이 아닌 것은?",["방사선은 방사성물질이 내는 에너지 흐름이다.","방사선은 눈에 보이지 않으며, 냄새나 맛이 없다.","방사선은 알파, 베타, 중성자, 엑스, 감마선으로 나뉜다.","방사선 종류별로 형태나 힘의 차이는 같다."],3,"방사선의 종류별로 형태나 힘의 차이는 각각 다르다."],[0,5,"다음 중 자연방사선이 아닌 것은?",["우주방사선","지각방사선","음식물 내 방사선","의료용 엑스선"],3,"의료용 엑스선은 인공적으로 만들어진 방사선이다."],[0,5,"방사성물질이 방사선을 내는 강도인 방사능의 단위가 아닌 것은?",["파스칼(Pa)","베크렐(Bq)","시버트(Sv)","그레이(Gy)"],0,"파스칼은 압력, 변형력의 국제단위이다."],[0,5,"다음 중 자연방사능인 라돈에 대한 설명으로 적합하지 않은 것은?",["땅 속의 천연방사능이 공기 중으로 확산된 형태이다.","라돈 자체를 흡입할 경우 폐의 피폭을 유발하여 폐암을 증가시킨다.","라돈의 자손핵종으로는 폴로늄-218, 납-214, 비스무스-214, 폴로늄-214 등이 있다.","실내공기를 주기적으로 환기시켜 라돈의 농도를 낮출 수 있다."],1,"라돈 자체는 헬륨처럼 불활성기체이므로 사람이 흡입하더라도 체내에 흡수되지 않고 다시 배기되므로 위해도가 미미하다. 라돈이 공기 중에서 붕괴하여 발생되는 자손핵종의 경우 폐암을 증가시키는 요인으로 알려져 있다."],[0,5,"황사 예보 시 분야별 대비요령으로 올바르지 않은 것은?",["외출 시에는 의약외품 마스크를 착용한다.","황사에 노출된 채소, 과일 등은 충분히 세척한 후 섭취한다.","황사가 발생하더라도 창문을 열어 환기시킨다.","호흡기질환이나 노약자는 되도록 실외활동을 자제한다."],2,"황사가 그친 뒤에 실내 공기를 환기시키도록 한다."],[0,5,"다음 중 옳지 않은 것은?",["페트병은 원래의 용도로 사용한 후 버리는 것이 좋다.","손이 델 정도의 뜨거움이 느껴지는 식품은 담지 않는 것이 좋다.","페트병에 담긴 식품은 직사광선을 피해 보관한다.","차 안의 온도가 높을 때 장시간 방치해도 괜찮다."],3,"실온에 2주 이상 방치할 경우 세균 감염 및 유해물질에 노출될 우려가 있다."],[0,5,"다음 중 가장 적은 양은?",["피코리터","나노리터","마이크로리터","밀리리터"],0,"① 1조분의 1리터 ② 10억분의 1리터 ③ 100만분의 1리터 ④ 1천분의 1리터"],[0,5,"노로바이러스 식중독 예방법으로 옳지 않은 것은?",["겨울철엔 굴, 어패류 등을 되도록 생식으로 섭취해야한다.","물을 끓여 마신다.","환자의 침으로도 감염될 수 있으므로 흐르는 물에 30초 이상 손을 씻는다.","조리도구는 염소소독 및 열탕처리 한다."],0,"굴 등 어패류 등은 생식으로 섭취하지 않고 중심온도 85℃ 1분 이상 익혀 먹어야 한다."],[0,5,"식중독을 일으키는 원인이 아닌 것은?",["노로바이러스","황색포도상구균","말라리아","살모넬라"],2,"말라리아는 모기가 물어 전파를 시키는 모기 매개성 전염병이다. 말라리아에 감염된 경우 초기 증상은 두통과 복통, 오한 및 근육통을 수반한다."],[0,5,"식중독 증상이 아닌 것은?",["복통","변비","구토","설사"],1,""],[0,5,"식중독 예방 3대 요령이 아닌 것은?",["오래된 음식 버리기","손씻기","익혀먹기","끓여먹기"],0,"식중독 예방 3대 요령은 손씻기, 익혀먹기, 끓여먹기"],[0,5,"커피, 차 잎 등에 들어 있으며 많이 섭취할 경우 불면증, 중독 등 부작용을 나타날 수 있 는 것은?",["인슐린","카페인","타우린","구연산"],1,"카페인은 커피나 차 같은 일부 식물의 열매, 잎, 씨앗 등에 함유된 알칼로이드의 일종으로 피로를 줄이는 등의 효과가 있으며 장기간 다량 복용할 경우 카페인 중독을 야기할 수 있다."],[0,5,"카페인 함량을 초과하여 섭취하는 등 우리 몸에 해로운 행동인 것은?",["하루 한 잔 우유 마시기","에너지 음료마시기","물 많이 마시기","100% 과즙주스 마시기"],1,"고카페인이 함유된 에너지음료의 경우 어린이 일일섭취권장량 이상의 카페인을 섭취하는 것이므로 부작용을 초래할 수 있음"],[0,5,"우리가 활동하는데 필요한 에너지를 만들며, 뇌가 활발하게 활동하는데 도움을 주는 영양 소는?",["비타민","지방","단백질","탄수화물"],3,"탄수화물은 감자, 고구마, 떡 등에 많이 함유되어 있는 영양소이며, 우리가 활동하는데 필요한 에너지를 만든다. 뇌는 포도당(탄수화물)을 에너지로 사용함"],[0,5,"다음 중 올바른 식습관이 아닌 것은?",["규칙적인 시간에 3끼 식사를 한다.","미역, 김, 다시마 같은 해조류를 먹는다.","녹황색 채소(당근, 시금치 등)를 먹는다.","가능한 고기는 먹지 않는다."],3,"단백질을 다량 함유한 고기, 계란, 콩, 두부는 하루에 2회 이상 섭취하는 것이 좋다. 단, 과다 섭취는 피할 것."],[0,5,"식사와 식사 사이에 먹는 것으로 하루에 필요한 에너지의 10~15% 정도가 적당한 이것은 무엇인가?",["낮잠","운동","간식","TV시청"],2,"간식은 하루에 필요한 에너지의 10~15%를 섭취하는 것이 적당하다."],[0,5,"가공식품 포장지에 표시하여 영양소의 종류와 양을 알려주는 표는 무엇인가?",["시간표","식단표","식품구성표","영양성분표"],3,""],[0,5,"패스트푸드와 튀긴 음식에 많이 있는 지방으로서 하루 에너지의 1%이하로 섭취해야하며 비만의 원인이 되는 이것은?",["필수지방산","트랜스지방","식이섬유","탄수화물"],1,""],[0,5,"다음 중 지용성 비타민이 아닌 것은?",["비타민 A","비타민 C","비타민 D","비타민 E"],1,"비타민 C는 수용성 비타민이다."],[0,5,"채소류와 과일류에 많이 있는 영양소이며 장운동을 도와 변비 예방에 좋은 영양소는?",["식이섬유","탄수화물","단백질","지방"],0,""],[0,5,"산성 및 염기성 용액을 판단하는데 쓰이는 이것은 무엇인가?",["현미경","돋보기","리트머스 종이","자석"],2,"리트머스 종이는 산성 용액에 넣으면 붉은색으로, 염기성 용액에 넣으면 푸른색으로 변한다."],[0,5,"다음 중 현미경의 구조가 아닌 것은?",["접안렌즈","대물렌즈","재물대","수정체"],3,"수정체는 눈의 구조 중 하나로 각막과 함께 눈의 주된 굴절 기관이다."],[0,5,"다음 중 자외선 차단제 사용법이 올바르지 않은 것은?",["외출 30분전에 충분한 양을 골고루 발라준다.","하루에 한 번만 바른다.","눈 주변은 피해서 바르고, 눈은 비벼서는 아니 된다.","집에 돌아오면 깨끗이 씻어서 닦아내야 한다."],1,"활동 중 땀 등으로 씻겨나갈 수 있으므로 차단제 효과는 시간이 갈수록 감소될 수 있음. 따라서 여러 번 덧발라주는 것을 권장"],[0,5,"전자레인지에 사용할 수 있는 용기 재질이 아닌 것은?",["폴리프로필렌","유리제","도자기제","알루미늄제"],3,"알루미늄은 철의 약 1/3정도로 가벼운 금속이며 공기나 물에서 잘 녹슬지 않으나, 열 및 전기를 전달하는 성질이 좋아 전자레인지에 사용할 경우 스파크가 발생하여 화재 및 폭발의 위험이 있음"],[0,5,"초콜릿, 커피, 녹차, 홍차, 코코아 등 기호식품이나 감기약, 두통약 등 의약품에도 존재하 는 ‘이것’. 피로회복, 이뇨작용 등의 이로운 작용도 하지만 과잉 섭취 시 불안, 메스꺼움, 구 토, 중독 시에는 신경과민, 불면증, 칼슘 불균형 등의 증상을 나타내기도 하는 ‘이것’은 무 엇일까요?",["나트륨","카페인","액상과당","비타민"],1,""],[0,5,"약을 올바르게 이용하는 방법으로 옳은 것은?",["약을 먹을 때는 우유와 함께 먹는다.","약은 무조건 냉장고에 보관한다.","빨리 낫고 싶으면 한꺼번에 많은 약을 먹는다.","약사가 알려준 방법대로 사용한다."],3,"약을 먹을 는?",["해빙기 안전관리 추진계획","여름철 수상레저 관리","폭염 대비 무더위 쉼터","동절기 레저시설"],0,"국가안전대진간 기간과 겹치므로 병행하여 실시."],[0,3,"다음 중 국가안전대진단을 실시하는 가장 중요한 이유는?",["국가 재정을 충당","북한과의 전쟁을 방지","사고를 미연에 방지하여 국민들의 안전을 확보","시민과 공무원이 함께하여 친목을 도모"],2,"국가안전대진단은 국민들의 안전을 확보하기 위한 것이 주 목적이며, 사고를 방지하기 위한 시설물 등의 안전점검이 주요계획이다."],[0,2,"이동식부탄연소기(휴대용 가스렌지) 및 부탄용기 바르게 사용한 경우는?",["조리 기구를 부탄연소기의 삼발이 보다 큰 것을 사용한다.","다 쓴 부탄용기는 사용 후 구멍을 뚫어 화기가 없는 곳에 버린다.","가스가 잘 나오지 않을 경우에는 부탄용기를 불로 가열한다.","실내에서 장시간 사용해도 환기를 시킬 필요는 없다."],1,"① 과대불판 사용 시 조리기구로 부터 부탄용기에 열이 가해져 폭발의 위험 이 있음 ③ 부탄용기를 직접 가열 시 내부압력 상승으로 폭발 가능성 있음 ④ 실내에서 사용 시 수시로 환기를 해주어야 사고를 방지 할 수 있음"],[0,2,"이사할 때 이사 차량에 실어서는 안 되는 것은?",["가스레인지","캐비넷 히터","가스통","휴대용 가스레인지"],2,"LP가스를 사용하는 가정집에서는 가스를 공급하는 판매업소와 안전공급계약을 체결해야 합니다. 이사 등으로 계약을 해지할 경우 가스통은 판매업소가 구매 또는 인수하여야 합니다."],[0,2,"겨울철 난방을 위해 작동 시키는 가스보일러에서 나오는 가스로 마시게 되면 두통, 어지러움, 호흡곤란을 호소하고 심하게는 사망에 이르게 하는 이 가스의 이름은 무엇일까요?",["O（산소)","N (질소)","CO (일산화탄소)","CO₂(이산화탄소)"],2,"보일러의 불완전연소로 인해 발생되는 CO(일산화탄소)가스는 마시게 되면 두통, 구역질, 어지러움 증을 호소하게 되며 심하게는 사망에 이르는 가스입니다."],[0,2,"도시가스의 사용 용도로써 적절한 것은?",["음식 등의 조리용","선박 엔진 가동용","지하철 구동용","화재 진압용"],0,""],[0,2,"가스사용시설에서 가스누출자동 차단장치란 가스가 누출되었을 때 가스를 감 지하여 밸브를 자동으로 잠궈 주는 안전장치를 말합니다. 다음 중 가스누출자동 차단장치의 구성 요소로서 틀린 것은?",["계량기","제어부","차단부","검지부"],0,"가스누출자동차단장치의 구성요소 제어부, 검지부, 차단부"],[0,2,"LPG자동차를 구입할 경우 교육을 받을 수 있다. 이때 LPG자동차운전자 교육을 실시하는 기관으로 알맞은 것을 고르시오.",["교통안전공단","경찰서","한국가스안전공사","가스공사"],2,"LPG자동차운전자 교육실시기관은 한국가스안전공사입니다."],[0,2,"다음 중 가스안전 전문기관인 한국가스안전공사가 하는 일로 적절하지 않은 것 을 고르시오.",["법정검사 수행","가스사고 조사","서민층 시설개선 사업","가스공급"],3,"가스공급은 한국가스공사 및 각 지역 도시가스회사가 하고 있습니다."],[0,2,"부탄용기(캔)의 폐기 방법으로 알맞은 것은?",["다 쓴 용기에 구멍을 내어 남은 가스를 빼낸 후 버린다.","다 쓴 용기를 재충전하여 다시 사용한다.","다 쓴 용기를 불 속에 집어 넣는다.","사용 한 용기를 그대로 쓰레기통에 버린다."],0,"다 쓴 부탄용기는 구멍을 내어 잔가스를 방출 시키고 버려야 추후 안전사고를 방지할 수 있습니다. 또한 부탄용기는 재충전금지 용기이므로 재충전사용 하는 것은 불법입니다."],[1,2,"불을 끄고 아픈 사람을 병원에 이송하는 사람은 경찰관이다.",null,1,""],[1,2,"119구조대 아저씨들은 불도 끄고, 동물도 구조한다.",null,0,""],[1,2,"하나의 콘센트에 여러 개의 전기기구를 꽂아두면 전기화재의 원인이 될 수 있다.",null,0,""],[1,2,"유리병 안에 들어있는 음료수(우유, 쌍화탕 등)를 전자레인지에 데워 먹어도 위험하지 않다.",null,1,"유리병 안의 액체가 폭발할 위험이 있으므로 유리 제품은 전자레인지 전용 제품만 사용해야 합니다."],[1,2,"공중전화에서 119로 신고전화를 하면 무료지만 집에서 신고를 하면 약 80원의 돈을 내야한다.",null,1,""],[1,2,"화재․구조․구급 신고 전화번호는 119로 세계 모든 나라가 다 같다.",null,1,"미국의 경우 911, 대만 199, 스위스 118, 프랑스 18"],[1,2,"일부러 불을 질러 일으킨 화재를 실화라 한다.",null,1,"일부러 불을 질러 일으킨 화재는 방화라 하고, 실수로 화재를 내 것을 실화라 합니다."],[1,2,"아파트에서 화재가 발생하면 신속히 대피해야 하죠, 대피할 때에는 수건 등에 물을 적셔 입고 코를 막고 낮은 자세로 신속히 대피해야 하기 때문에 엘리베이터를 타고 대피해야 한다.",null,1,"화재 시 엘리베이터는 정전되어 멈추게 되므로 운행 중 갇히게 되고, 연기나 화염의 이동 통로가 되기 때문에 이용하지 말아야 합니다."],[1,2,"소화기는 미관을 생각하여 잘 보이지 않는 곳에 두어야 한다.",null,1,""],[1,2,"불이 났을 때 우리의 생명을 가장 위협하게 하는 것은 연기이다.",null,0,""],[1,2,"1년 중 강우량이 적고 건조하여 산불이 가장 많이 발생하는 계절은 봄이다.",null,0,""],[1,2,"화상을 입었을 때는 흐르는 차가운 물에 재빨리 담근 후 깨끗한 헝겊으로 상처 부위를 감싸 세균의 감염을 막는다.",null,0,""],[1,2,"화상을 입었을 때는 소주가 최고이다.",null,1,""],[1,2,"화재로 인한 화상부위에 응급처치로 고통을 감소하기 위해 주변에 있는 된장을 바른다.",null,1,"된장, 간장 등을 바르면 상처를 불결하게 하여 세균을 감염시키는 원인이 됩니다."],[1,2,"코피가 흐를 땐 머리를 뒤로 젖혀야 한다.",null,1,"코피가 나면 얼굴을 바로 하고 콧잔등을 잡아 주며 코피를 닦는다."],[1,2,"방화, 담뱃불, 가스, 전기 화재 중 우리나라에서 가장 많이 발생하는 화재의 원인은 전기 화재이다.",null,0,""],[1,2,"식용유와 같은 기름을 이용하여 요리를 하다가 불이 났을 때 불을 끄기 위하여 물을 뿌린다.",null,1,"기름 화재에 물을 뿌리면 불이 더욱 커지므로 분말소화기를 사용하여 불을 꺼야 하며, 소화기가 없을 때에는 채소로 끌 수 있답니다."],[1,2,"소화기 종류에는 산소 소화기도 있다.",null,1,"산소는 불이 일어나기 위한 필수 요소입니다."],[1,2,"LPG 가스가 새면 냄새를 맡을 수 없다.",null,1,"가스가 새는지 여부를 알기 위해 마늘 썩는 냄새를 섞는다."],[1,2,"매년 11월은“전국 불조심 강조의 달”이다.",null,0,""],[1,2,"화재현장에서 소방서장은 구경하는 사람에게 불을 끄라고 할 수 있다.",null,0,""],[1,2,"가정집에서 119에 신고를 하면 119에서는 어디에서 전화를 하였는지 알 수 있다. 그렇다면 공중전화에서 119로 전화를 했을 때에는 어디서 전화를 했는지 모른다.",null,1,""],[1,2,"화상을 당했을 때 상처에 소독 솜이나 기름 등을 사용하면 됩니다.",null,1,""],[1,2,"유독물질을 마셨을 경우 물이나 우유를 먹여서 함께 토하게 하면 안 된다.",null,0,""],[1,2,"전기에 감전된 어린이를 직접 만지면 된다.",null,1,""],[1,2,"한쪽 눈을 다쳤을 때 양쪽 눈을 다 가린다.",null,0,""],[1,2,"경련을 하고 있는 사람을 보면 꽉 잡아서 경련을 못하게 한다.",null,1,""],[1,2,"눈에 이물질이 박혀 있을 때 병원 가기 전에 빼내면 안 된다.",null,0,""],[1,2,"목구멍에 이물질이 걸린 경우 손가락을 넣어서 빼내야한다.",null,1,""],[1,2,"집에서 요리할 때 사용하는 가스는 LPG와 LNG가 있다. LPG는 공기보다 가볍고, LNG는 공기보다 무겁다.",null,1,""],[1,2,"가스냄새가 심하게 날 때는 선풍기를 켜서 날려 보낸다.",null,1,"가스 냄새가 날 때 전기를 사용하면 전기불꽃에 의해 가스폭발 위험이 있으므로 절대로 전기를 사용하면 안 되며 창문을 열어 환기를 시켜야 한다."],[1,2,"산소를 차단해 불을 끄는 방법을 소방용어로 질식소화라 하고, 물을 뿌려서 소화를 하는 것은 냉각소화라 한다.",null,0,""],[1,2,"119구급대원을 상징하는 동물은 비둘기고, 화재진압대원을 상징하는 동물은 진돗개이다.",null,1,"화재진압대원을 상징하는 동물은 코끼리, 구급대원은 비둘기, 구조대원이 진돗개입니다."],[1,2,"뱀에 물리면 상처난 곳을 심장보다 높게 들어야 안전하다.",null,1,"심장보다 높게 하면 혈관 속의 독이 온몸으로 퍼지므로 상처 난 곳을 심장보다 낮게 해야 합니다."],[1,2,"뱀에 물렸을 땐 상처 부위를 동여매고 입으로 독을 빨아낸다.",null,1,"입으로 독을 빨아낼 경우 위험합니다."],[1,2,"산불과 습도는 밀접한 관계가 있는데, 습도가 60%이상이면 산불이 발생할 확률이 낮아진다.",null,0,""],[1,2,"화재의 종류는 소화기를 보면 표시가 되어 있듯이 A,B,C,D급으로 나눠지는데 A급 화재는 전기 화재를 뜻하는 것이다.",null,1,"A급=일반화재, B급=유류화재, C급=전기화재, D급=금속화재)"],[1,2,"해수욕장이 놀이터에서 놀다가 눈에 모래가 들어갔을 때는 눈을 빨리 손으로 비벼서 모래를 빼내어야 한다.",null,1,"손으로 비비지 말고 흐르는 물에 씻고 병원으로 가서 치료를 받아야 합니다."],[1,2,"화재는 가연물이 대류, 전도, 복사의 과정을 통해 연소 확대되는데 대류는 열에너지가 전자파의 형태로 사방으로 전달되는 현상이다.",null,1,"전자파 형태로 사방에 열이 전달되는 현상은 복사"],[1,2,"우리나라 법에 방화범은 형법에 의거 징역에 처하도록 하고 있습니다. 그렇다면 실수로 불을 낸 사람에 대해서도 벌금형에 처할 수 있다.",null,0,""],[1,2,"소방관서에서는 화재발생이 많은 겨울철 화재를 예방하기 위해 매년「불조심 강조의 달」을 설정하고 시민들의 동참을 유도하고 있습니다. 그러면 여기서 말하는 불조심 강조의 달은 11월 달이다.",null,0,""],[1,2,"소방본부에서는 산행 중인 시민이 부상을 당했을 경우 신속하게 자가 응급처치를 할 수 있도록 119산악구급함을 설치하고 응급처치물품을 비치․관리하고 있다. 산악구급함에는 잠금장치가 설치되어 있는데, 응급상황 시 구급함을 사용하기 위해서는 119로 전화해야한다.",null,0,""],[1,2,"구급대원이 도착하기 전에 심폐소생술이나 자동제세동기를 이용하여 적극적으로 심정지 환자를 소생시킨 사람에게는 핑크세이버 표창을 수여한다.",null,1,"심장을 구하는 사람이라는 의미로 “하트세이버”가 정답"],[1,2,"변호사도 구급대원으로서의 자격이 있다.",null,1,"의사, 간호사 등 의료인이나 응급구조사 자격을 갖춘 사람, 소정의 교육을 이수한 사람만이 구급대원이 될 수 있음"],[1,2,"구급활동을 하고 있는 구급대원을 폭행했을 경우 징역형이나 벌금을 선고받는다.",null,0,""],[1,2,"119로 신고해도 응급처치에 대한 상담, 병원이나 약국 안내를 받을 수 있다.",null,0,""],[1,5,"응급처치의 목적은 의학적 도움 없이 환자를 치료함으로써 환자의 생명을 구하고자 하는데 있다.",null,0,""],[1,5,"응급환자가 발생했을 때 현장의 목격자가 신속한 도움을 주는 것은 매우 중요함으로 응급처치원은 119에 신고할 때 중요한 내용만을 알리고 즉시 환자를 처치해야 한다.",null,1,""],[1,5,"응급처치원이 동의를 얻는 방법에는 묵시적 동의와 명시적 동의가 있다. 어린아이의 경우에 보호자가 없을 땐 묵시적 동의로 간주하고 응급처치를 실시한다.",null,0,""],[1,5,"우리나라는 “선한 사마리아인법”과 관련된 응급의료법을 제정하여 일반인들이 주저하지 않고 위험에 처한 사람들을 도울 수 있도록 보호하고 있다.",nul 동차의 바로 앞이나 뒤로 횡단한다.","육교나 지하도, 횡단보도를 이용해서 길을 건넌다.","녹색신호가 켜졌더라도 좌우의 안전을 살핀 다음 길을 건넌다.","신호 없는 횡단보도에서는 운전자에게 손을 들어 차가 멈춘 것을 확인하고 횡단한다."],0,"자동차의 바로 앞이나 뒤로 횡단하는 행동은 다른 차의 운전자에게 어린이의 발견을 어렵게 하고 어린이도 다가오는 자동차를 보기 어려우므로 매우 위험한 행동이다."],[0,1,"중앙선이 없고 인도와 차도의 구분이 없는 도로에서 차를 마주 보고 걸으려면 도로의 어느 쪽으로 걸어야 안전하겠는가?",["도로의 오른쪽","도로의 왼쪽","도로의 중앙부분","아무데서나 관계없다."],1,"보도나 복도 등에서 걸을 때는 보도나 복도 계단 등의 오른쪽으로 통행하지만 보도와 차보가 구분되지 않는 이면도로에서 차를 마주보고 걸으려면 도로의 왼쪽 길 가장자리를 걷는 것이 바람직하다."],[0,1,"통학버스를 이용할 경우 안전한 행동은?",["내려야 할 곳이 다 와 가면 미리 일어나서 내릴 준비를 한다.","먼 거리를 가지 않고 내려야 하므로 안전띠는 매지 않는다.","내릴 때에 우측에서 자전거나 오토바이가 오는지 확인하고 내린다.","내가 타고 온 차 앞으로 신속히 길을 건넌다."],2,"내가 타고 온 차 앞으로 지나갈 경우 그 차량과 충돌할 수 있다."],[0,1,"차를 탈 때 우리가 지켜야 할 안전수칙 중 잘못된 것은?",["큰 소리로 떠들거나 장난치지 않는다.","안전띠는 운전자만 한다.","차에서 내릴 때는 안전을 살피고 내린다.","내릴 때는 차례차례 내린다."],1,"안전띠는 전 좌석에서 안전띠를 매야한다."],[0,1,"기차여행을 할 때 우리가 지켜야 할 사항 중 틀린 것은?",["기차를 탈 때는 승객이 내리기 전에 먼저 올라탄다.","기차를 타는 곳에서는 노란색 안전선 밖에서 기다린다.","애완동물은 전용가방에 넣어서 열차에 탑승한다.","열차에서는 뛰어다니지 않고 조용히 자리에 앉아 있어야 한다."],0,"열차나 지하철 등을 탈 때에는 승객이 내린 후에 차례차례 타야 한다."],[0,1,"다음 중 잘못된 행동은 무엇일까요?",["차도 근처에서는 놀지 않는다.","주차나 정차하고 있는 자동차 앞뒤는 위험하므로 놀지 않는다.","자동차의 신호를 파악하여 안전하게 행동한다.","공이 도로를 향해 굴러가면 얼른 가서 주워야한다."],3,"“주차”란 오랜 시간 동안 서 있는 차량을 말하며 “정차”란 언제든지 출발할 수 있는 차량을 말한다."],[0,1,"운전자가 교통사고를 일으키는 원인으로 볼 수 없는 것은?",["교통법규 무시","안전의식 부족","조급한 마음","양보하는 마음"],3,"교통사고를 일으키는 운전자의 마음에는 법규무시, 이기심, 조급증, 자기중심적인 생각 등이 있다."],[0,1,"여름 휴가철에 물놀이할 때의 주의사항으로 틀린 것은?",["수영금지 팻말이 있는 곳에는 들어가지 않는다.","물에 들어가기 전에 준비운동을 충분히 한다.","가능하면 외진 곳이나 어른이 없는 곳에서 혼자서 물놀이를 즐긴다.","물놀이할 때 지나친 장난은 하지 않는다."],2,"외딴곳이나 주변에 어른이 없는 곳에서 사고가 발생하면 구조요청이 어려우므로 반드시 어른이 지켜보는 곳에서 물놀이를 해야 한다."],[0,1,"자동차가 위험을 발견하고 멈추려고 브레이크를 밟았을 때 가장 많이 미끄러지는 경우는?",["마른 도로면인 경우","비가 내려 도로표면이 젖은 경우","안개가 낀 경우","눈이나 빙판길의 경우"],3,"평상시보다 빗길에서는 1.5배 정도 정지거리가 길어지며, 눈길이나 빙판길에서는 3-5배 정도가 길어진다. 안개길의 경우는 빗길과 비슷한 정지거리라고 보면 된다."],[0,1,"학원버스를 타고 내릴 때 꼭 지킬 사항이 아닌 것은?",["차내에서 장난을 치지 않고, 운행 중 마음대로 돌아다니지 않는다.","차에서 내릴 때 손잡이를 잡고 오토바이나 자전거가 오는지 뒤를 보면서 천천히 내린다.","버스가 완전히 멈출 때까지 차도에 내려서지 않는다.","버스 안에서 떠들지 않고 조용히 스마트폰으로 게임을 한다."],3,"창문으로 머리나 손을 내밀지 말아야 하고, 차내에서는 장난은 금물이며, 내릴 때 자전거나 오토바이가 올 수 있으므로 잘 살피고 내려야 한다. 버스 내에서는 안전띠를 매고 스마트폰은 하지 않아야 한다."],[0,1,"열차 또는 지하철 승·하차 시 주의할 점이 아닌 것은?",["지하철을 기다릴 때 반드시 노란색 안전선 안에서 기다려야 한다.","전철에 탄 사람이 먼저 내린 다음 천천히 걸어서 탄다.","전철의 경우 타고 내릴 때 전철과 승차대와 간격이 벌어져있으므로 발이 빠지지 않도록 주의하면서 탄다."],0,"노란색 안전선 밖에서 기다려야 한다"],[0,1,"어두운 밤에 길을 갈 때 올바르지 못한 것은?",["밝은 색의 옷을 입는다.","반사재가 달린 가방이나 손목 반사재 등을 차고 다닌다.","좁은 길에서 차와 마주치면 일단 멈추고 길의 가장자리에 서서 차가 지나가기를 기다린다.","빨리 다니기 위해 자전거나 인라인스케이트를 자주 이용한다."],3,"저녁 이후 시간에는 자전거 나 인라인의 발견이 어렵기 때문에 타지 않도록 한다."],[0,1,"통학버스에서 안전하게 내리는 방법이 아닌 것은?",["버스에서 내릴 때는 옷이나 가방 끈이 걸리지 않도록 한다.","버스에서 내리다 물건을 떨어트리면 소리쳐 알린다.","버스에 내려서 버스 근처에서 친구들과 이야기한다.","버스에 내릴 때는 뒤쪽의 오토바이나 자전거가 오지 않는지 확인하고 내린다."],2,"버스에서 내린 후에는 버스 근처에 있게 되면 버스운전자가 발견하기 어렵기 때문에 위험하다."],[0,1,"자전거 안전점검은 언제 해야 하는지 가장 옳은 것은?",["자전거를 타고 난 후에만 점검한다.","자전거를 타기 전과 타고 난 후 항상 점검한다.","한 달에 한 번 정도 생각날 때 점검한다.","사고가 발생한 후에 점검한다."],1,"자전거 안전점검은 자전거를 타기 전에는 반드시 핸들, 체인, 브레이크 등의 점검을 철저히 해야 한다."],[0,1,"가족과 저녁 외식을 하고 돌아오는 길이다. 아버지가 소주를 한 병 마신 상태에서 운전하려고 한다. 이때 올바른 태도는?",["어른이 하는 일이기 때문에 모른 척한다.","음주운전은 절대로 안 되기 때문에 운전하지 않도록 말린다.","아버지 혼자 운전하라고 하고 나머지 가족은 택시를 타고 간다.","아버지에게 천천히 운전하라고 말씀드린다."],1,"술은 조금이라도 마신 상태에서는 절대로 운전해서는 안 되며, 가족 등은 적극적으로 음주운전을 안 하도록 말려야 한다."],[0,1,"휴가나 추석 명절을 맞아 시골로 갔을 때 지켜야 할 안전수칙 중 틀린 것은?",["보도가 없는 곳에서는 자동차와 마주 보는 방향의 가장자리로 걷는다.","농기계에 주의하며 걷는다.","늦은 밤에 혼자서 나가 놀아도 된다.","가능한 사람이 다니는 길만 이용한다."],2,"시골길은 가로등이 턱없이 부족한데도 많으므로 자동차나 자전거, 세워진 농기계 등을 발견하지 못해 사고가 발생할 수 있다. 그러니 가능한 밤에는 바깥 활동을 자제하고 피치 못 할 경우에는 어른들과 함께할 수 있도록 한다."],[0,1,"인라인 스케이트를 탈 때 안전수칙으로 틀린 것은?",["안전하게 정지하는 방법과 넘어지는 방법 등 기초교육을 받는다.","이어폰을 귀에 꽂고 신나는 노래를 들으면서 달린다.","해가진 후에는 될 수 있으면 않는다.","헬멧과 손목보호대, 무릎보호대 등 안전 장구를 착용한다."],1,"자전거나 인라인, 그리고 보행중일 경우에도 이어폰을 꽂고 노래를 듣는 것은 위험한 행동임을 인식해야 한다."],[0,1,"다음 중 어떤 옷을 입는 것이 야간에 가장 잘 보이겠는가?",["파란색 계열의 옷","밝은 색 계열의 옷","검은색 계열의 옷","형광 및 반사체 옷"],3,"파란색이나 검은 색 계열의 옷은 약 30미터, 흰색 등 밝은 색 계열의 옷은 50미터, 형광 및 반사체의 경우는 120미터 정도에서 발견이 된다."],[0,1,"횡단보도가 없는 길을 가장 안전하게 횡단하는 방법은?",["주차된 차 바로 앞이나 뒤에서 뛰어 건넌다.","횡단보도가 없으므로 길을 건너면 안 된다.","좌우로 살펴보고 안전을 확인한 후에 도로 폭이 가장 짧은 길로 건넌다.","주・정차된 차 사이에서 신속히 건넌다."],2,"주차된 차 앞과 뒤에서 뛰어 건널 경우 주차된 자가 움직일 수가 있으며 도로에서 통행하는 차량이 갑자기 뛰어 나온 어린이를 발견하지 못할 수 있으므로 매우 위험함. 횡단보도가 없는 길에서는 좌우를 잘 살피고 차량이 없으면 도로 폭이 가장 짧은 길로 건너야 한다."],[0,1,"초등학생인 찬호가 가족들과 함께 자동차를 타고 갈 경우 잘못된 행동은?",["운전하는 아버지와 대화하기 위해 조수석에 탄다.","모든 좌석은 안전띠를 착용한다.","창문 밖으로 손이나 머리를 내밀지 않는다.","차에서 내릴 때는 주위를 충분히 살펴본 후 문을 연다."],0,"몸집이 작은 어린이가 앞좌석에 타게 되면 사고가 발생한 경우에 에어백이 터지면서 목이나 얼굴부상이 가중될 수 있기 때문에 뒷좌석에서 안전띠를 몸에 맞게 착용하는 것이 효과적이다."],[0,1,"눈 오는 날의 안전한 보행에 관한 내용 중 틀린 것은?",["길에서 미끄럼을 타거나 장난하지 않는다.","내리는 눈을 피하기 위해 고개를 푹 숙이고 걷는다.","날씨가 춥다고 움츠리지 않고, 앞을 잘 보며 걷는다.","장갑을 꼭 끼고 손을 주머니에 넣지 않는다."],1,"<눈 오는 날의 안전보행 방법> ◦ 자동차에 더욱 주의하며 길에서 미끄럼을 타거나 장난하지 않아야 한다. ◦ 날씨가 춥다고 움츠리지 않고 앞을 잘 보며 걷는다. ◦ 손을 주머니에 넣으면 넘어지기 쉽고 넘어졌을 때 위험하므로 장갑을 꼭 끼고 주머니에 손은 넣지 않고 다닌다. ◦ 보통 때보다 차도에서 더 멀리 떨어져 걷는다. "],[0,1,"눈 오는 날 보행하는 자세로 올바르지 못한 것은?",["주머니에 손을 넣지 않고 따뜻한 털장갑을 끼고 걷는다.","구두보다는 홈이 파여 있는 운동화를 신고 천천히 걷는다.","안전과 따뜻함을 위해 털모자나 털옷을 입고 보행한다.","밝은색 옷을 입어야 눈에 잘 띄기 때문에 흰옷을 입는다."],3,"눈 오는 날에는 흰색이 눈에 잘 보이지 않기 때문에 밝은 색깔의 옷을 입는 것이 안전하다."],[0,1,"다음 설명 중 맞는 것은?",["차에서 운전하는 아저씨는 차 밖에 있는 사람을 다 잘 볼 수 있다.","속도를 내고 달리는 차는 바로 정지하지 못한다.","자동차가 후진할 경우에는 어떤 신호도 들어오지 않는다.","횡단보도 앞에서는 모든 차가 잠깐 정지했다가 간다."],1,"◦ 운전자는 사각지대가 있어서 차 밖에 있는 사람을 완전하게 잘 볼 수는 없다. ◦ 속도를 내며 달리는 자동차는 곧바로 정지할 수 없고 브레이크를 밟은 후 어느 정도 진행한 다음 정지할 수 있다. ◦ 자동차가 후진할 경우에는 자동차 후진등에 불이 켜진다. "],[0,1,"신호등 없는 횡단보도를 건널 때의 위험상황이다. 틀린 것은?",["횡단보도라도 양보해 주지 않는 운전자도 있다.","차는 멀리 있어도 속도가 있기 때문에 순식간에 다가온다.","어린이 등 몸집이 작은 사람은 운전자의 눈에 잘 띄지 않을 수도 있다.","혼자서 건널 때보다는 여러 명이 함께 건널 때가 더 위험하다."],3,"일반적으로 어린이 혼자 건널 때는 몸집이 작으므로 운전자의 눈에 잘 보이지 않을 수 있으므로 여러 명이 함께 건널 때가 더 안전하다."],[0,1,"다음 표지(표시)의 명칭은?",["횡단보도","과속방지턱","주정차 금지","자전거 횡단도"],1,""],[0,1,"다음 안전표지의 뜻은?",["어린이 보호표지","엄마 손잡고 건너기","선생님 보호 아래 건너기","안전지킴이 지도 아래 건너기"],0,""],[0,1,"도로교통법에서 규정한 어린이 보호구역에서 제한할 수 있는 속도는?",["시속 10킬로미터 이내","시속 20킬로미터 이내","시속 30킬로미터 이내","시속 40킬로미터 이내"],2,"시속이란 뜻은 한 시간 동안 이동하는 속도를 말한다."],[0,1,"보행자가 알아야 할 자동차의 특성에 대한 설명이다. 맞는 것은?",["작은 자동차일수록 사각(死角)이 커진다.","사각지대(死角地帶)에 있으면 위험하므로 자동차 가까이 가지 않는다.","자동차의 정지거리는 눈길이나 빗길에서는 짧아진다.","자동차의 속도가 빠를수록 정지거리는 짧아진다."],1,"◦사각은 운전자가 운전석에서 볼 수 없는 부분을 말하며, 큰 자동차일수록 사각지대(운전자가 보이지 않는 곳)가 크다. ◦정지거리란 자동차가 달리다가 운전자가 브레이크를 밟기 시작한 때로부터 정지할 때까지 미끄러지는 거리를 말한다. ◦자동차의 속도가 빠를수록 정지거리는 길어진다."],[0,1,"자동차가 우회전할 때 앞바퀴보다 뒷바퀴가 도로 가장자리로 더 가까이 지나가게 되는 것을 무엇이라 하는가?",["사각지대","내륜차","중앙분리대","수막현상"],1,"◦사각지대란 운전석에서 잘 보이지 않는 각도에 있는 지대를 말함. ◦중앙분리대란 좌우 차로에 대한 경계표시로 선 대신 대를 만들어 놓아 중앙선 침범을 방지하는 역할을 함. ◦수막현상이란 노면에 비가 내려 자동차 바퀴와 노면 사 이에 물이 있어 타이어가 노면과의 마찰이 줄어들어 잘 미끄러지는 현상을 말함."],[0,1,"다음 안전표지의 뜻은?",["자전거 전용도로 표지","자전거 주차장 표지","자전거 및 보행자 겸용도로 표지","자전거 횡단도 표지"],2,""],[0,1,"다음 안전표지의 뜻은?",["어린이 보호구역 표지","보행자 보행금지 표지","어른 진입금지 표지","보행자 전용도로 표지"],1,""],[0,1,"다음 안전표지의 뜻은?",["미끄러운 도로 표지","과속방지턱 표지","쌍굴터널 표지","노면 고르지 못함 표지"],3,""],[0,1,"물놀이를 시작하기 전에 손과 발의 경련을 방지하기 위해 가장 먼저 해야 할 일은 무엇인가?",["준비 운동하기","밥 먹기","낮잠 자기","명상하기"],0,"준비운동을 한 다음 다리부터 서서히 들어가 몸을 순환시키고 수온에 적응시켜 수영하기 시작한다."],[0,1,"다음 중 에스컬레이터를 이용하는 방법으로 옳지 않은 것은?",["에스컬레이터를 탈 때 손잡이를 잡고 탄다.","에스컬레이터를 탈 때 노란선 안에 서고 핸드레일 밖으로 손이나 몸을 내민다.","에스컬레이터에서 걷거나 뛰지 않고 얌전히 탄다.","에스컬레이터에서 친구를 밀거나 잡아당기는 행동을 하지 않는다."],1,"핸드레일 밖으로 머리나 팔을 내밀지 말아야 한다."],[0,1,"화재 발생 원인이 되는 행동은?",["음식 조리 중에는 그 자리에서 벗어나지 않는다.","가스레인지 주변에 불에 잘 타는 물질 두지 않는다.","한꺼번에 많은 콘센트를 연결해두지 않는다.","콘센트에 먼지가 쌓이도록 방치한다."],3,"콘센트에 먼지가 쌓이면 화재로 이어질 수 있다."],[0,1,"다음 중 화재 발생 시 행동 요령으로 올바른 것은?",["엘리베이터를 타고 내려오는 행동","가구 밑에 숨는 행동","출입문의 금속 손잡이를 만지는 행동","작은 불일 경우 소화기나 소화전을 이용하여 불을 끄는 행동"],3,"화재발생시 대피할 때 엘리베이터를 이용하지 말고 계단을 이용해야 한다. 가구는 불에 탈 수 있으므로 가구 밑으로 들어가지 않는다. 쇠 손잡이가 뜨거울 수 있으므로 직접 만져서는 안 된다."],[2,1,"자동차 운전면허를 취득할 수 있는 나이는 영국 만 17세, 캐나다 만 16세, 호주 만 16세 등이다. 그렇다면 우리나라의 원동기장치자전거(오토바이)운전면허 취득이 가능한 나이와(A) 자동차 운전면허를 취득할 수 있는 나이(B)는 몇 살인지 각각의 나이를 쓰세요.",null,"A : 만16세, B : 만18세",""],[2,1,"자동차(승용차, 버스, 화물차 등)만이 빠른 속도로 통행할 수 있는 도로는?",null,"고속도로 또는 자동차전용도로",""],[2,1,"운전자가 운전석에서 확인할 수 없는 부분은 무엇인가?",null,"사각지대","사각지대 : 운전자가 운전석에서 확인할 수 없는 부분을 사각지대라 하는데 이로 인하여 오토바이나 어린이 등을 보지 못하여 교통사고가 발생하는 경우가 있다. 사각지대는 소형차보다는 차체가 클수록 사각지대도 커짐."],[2,1,"소방차, 경찰차, 11 "콘센트 주변에 먼지가 많으면 화재로 이어지기 쉽다.",null,0,""],[1,2,"전기가 잘 들어온다면 오래된 전기배선이어도 계속 사용해도 좋다.",null,1,"오래된 전기배선은 전류의 흐름이 원활하지 못해 불꽃을 발생시키니 교체해야 한다."],[1,2,"가스레인지 사용 시 자리를 오래 비우지 않는다.",null,0,""],[1,2,"누전차단기는 정격용량의 퓨즈를 사용하고 매년 1회 누전검사를 해야 한다.",null,1,"누전검사는 한 달에 한 번씩 하는 것이 안전하다."],[1,2,"주택 화재는 전열기구를 많이 사용하는 낮에 발생하는 경우가 많아 주의해야 한다.",null,1,"주택화재는 심야 취약시간대에 발생하는 경우가 많으며, 취침으로 화재를 인지하기 힘들어 큰 피해가 일어나기 쉽다."],[1,2,"온열매트를 보관할 때에는 접지 않고 말아서 보관하는 것이 좋다.",null,0,""],[1,2,"난방기구 등 전열기구 사용 시 주변에 탈 수 있는 물건을 두지 않는다.",null,0,""],[1,2,"주택 화재경보기는 1가구에 1개 설치한다.",null,1,"주택화재경보기는 1구획 마다 1개씩 설치한다."],[1,2,"소화기의 내용연수는 10년이므로 그 기간 동안은 그대로 두어도 된다.",null,1,"소화기의 약제가 굳지 않도록 흔들어주는 것이 좋다."],[1,2,"이산화탄소 소화기는 질식작용을 통해 불씨를 잠재우는 역할을 하는 소화기로 주택용으로 적합하다.",null,1,"이산화탄소 소화기는 소화대상물의 손상이 적은 장점 때문에 주로 미술관이나 박물관 등에 비치되며 질식 우려가 높은 지하나 일반 가정에는 비치하지 않는다."],[1,2,"주택용 소방시설은 소화기, 옥내소화전, 주택화재경보기를 말한다.",null,1,"옥내소화전은 주택용 소방시설에 속하지 않는다."],[1,2,"주택화재경보기는 설치하기 까다롭기 때문에 전문 시공사를 부르거나 소방서에 요청해야 한다.",null,1,"주택화재경보기(단독경보형감지기)는 전기식이 아닌 건전지 사용 방식이라 드라이버만 있으면 쉽게 천장에 설치 가능하다."],[1,2,"화재가 발생하지 않았지만 요리 시 부주의로 연기가 발생해서 주택화재경보기가 작동한 경우라도 119에 신고해 경보기를 꺼야한다.",null,1,"오작동이나 단순 그을음 등으로 인한 연기 발생의 경우 경보기를 돌리면 손쉽게 작동을 멈출 수 있다."],[1,2,"주택화재경보기가 울리면 자동으로 119에 신고가 되므로 신고하지 않아도 된다.",null,1,"주택화재경보기는 연기를 인식할 경우 경보음을 울리게 하는 장치다. 자동으로 신고가 되지 않으므로 초기 화재의 경우 소화기로 진화하고, 큰 화재는 안전한 곳으로 대피해 119에 신고하는 것이 좋다."],[1,2,"화재에 대비해 피난로를 2개 이상 확보해 두고 가족 구성원 모두 대피 계획을 미리 세워 두는 것이 안전하다.",null,0,""],[1,2,"화재 시에는 닫힌 문을 빠르게 열어 신속하게 대피한다.",null,1,"문 손잡이에 손등을 대어 보았을 때 뜨거우면 밖에 불이 많이 번져 있다는 것이므로 무리하게 문을 열지 않는다."],[1,2,"주방에서 식용유로 요리 중에 불이 붙은 경,우 재빨리 싱크대의 물로 불을 끈다.",null,1,"식용유에 물이 가해지면 불길이 치솟아서 더 큰 화재로 번질 수 있다."],[1,2,"모든 화재는 대피를 우선적으로 해야한다.",null,1,"식불길이 머리 위로 번지지 않은 초기의 작은 화재는 소화기로 소화하는 것이 좋지만, 항상 대피로를 염두에 두고 상황에 맞게 행동하는 것이 좋다."],[1,2,"전기 화재 시 소화기 또는 물을 이용해 소화한다.",null,1,"전기화재 시 물을 가하는 것은 감전의 위험이 있으므로 절대 금물이다."],[1,2,"노래방(다중이용업소) 영업주는 상반기, 하반기 1년에 총 2회 안전시설 등 세부점검표를 작성해야 한다.",null,1,"다중이용업소 영업주는 분기별로 1회씩 1년에 총 4회의 세부점검표를 작성하고 1년간 보관해야 한다."],[1,2,"노래연습장을 비롯한 소방관계법 상 모든 다중이용업소에서 사용하는 소파, 커튼은 방염성능이 있는 제품으로 설치해야 한다.",null,0,""],[1,2,"영업주는 소화기 분실 및 고장을 방지하기 위해 평소에는 소화기를 한 곳에 모아두거나 창고에 보관해야 한다.",null,1,"소화기는 노래방 각 룸마다 잘 보이는 곳에 비치해야 하며, 복도는 보행거리 20m마다 (대형은 30m마다) 1개씩 비치해야 한다."],[1,2,"노래방이 있는 연면적 2,000㎡이상 대상물은 사용승인일이 속한 달까지 종합정밀점검을 받아야 한다.",null,0,""],[1,2,"노래방 화재 시 영업주가 가장 먼저 해야할 행동은 화재를 피해 바로 대피하고 119에 신고하는 것이다.",null,1,"영업주는 \"불이야\"라고 이용객들에게 화재사실을 알리고 손님들을 안전한 곳에 대피시켜야 한다."],[1,2,"영업주는 비상구에 추락 방지를 위해 부속실에서 건물 외부로 나가는 문 안쪽에 쇠사슬 또는 안전로프 등을 바닥에서부터 120cm 이상의 높이에 가로로 설치해야 한다.",null,0,""],[1,2,"노래방에서 화재 발생 시 이용객 인명피해가 가장 큰 위험요인은 화재의 열기로 인한 화상이다.",null,1,"인명피해의 주원인은 화재로 인해 발생한 연기다."],[1,2,"소화기는 출입문 가까이에 두면 통행에 지장을 주기 때문에 출입문에서 멀리 떨어진 구석에 보관한다.",null,1,"소화기는 출입문 근처, 습기가 적고 햇빛이 없는 서늘한 곳에 보관해야 한다."],[1,2,"분말소화기의 내용연수는 제조년월부터 10년이며 성능확인검사 통과 시 3년의 기한연장이 가능하다.",null,0,""],[1,2,"화재가 발생하여 신고하는 경우 건물의 위치, 업소명, 화재종류 등에 대한 정보를 제공한 뒤 신고한 휴대전화로 지인들에게 이 사실을 알린다.",null,1,"출동하는 구급대원이 정확한 정보습득을 위해 신고한 휴대전화로 연락할 수 있다. 되도록이면 다른 통화를 삼가 해야 한다."],[1,2,"노래방에는 화재를 진화하기 위한 소화기와 함께 간이 스프링클러를 의무적으로 설치하도록 되어 있다.",null,1,"간이 스프링클러는 지하층 또는 밀폐구조의 영업장과 대규모 건물에만 설치한다."],[1,2,"화재 발생 시 노래영상기기의 작동을 정지 시켜서 화재 사실을 손님들에게 알리기 위한 영상음향차단장치는 수동으로 작동시켜야만 한다.",null,1,"화재 발생 시 감지기등과 연동되어 자동으로 작동할 수도 있다. 다만 수동 작동이 가능한 경우에는 수동으로 작동해도 된다."],[1,2,"영업장내 설치된 피난용 휴대용 비상조명등은 손님들이 가져가거나 장난치므로 빼서 카운터에 보관하다가 화재 발생 시 손님들에게 배부하여 사용한다.",null,1,"휴대용 비상조명등은 노래방 각 실에 항상 비치해둬야 한다."],[1,2,"출입구와 비상구가 각각 설치되어 영업장 내부를 모든 이용객이 볼 수 있는 구조의 노래방에는 비상구에 유도등을 설치하지 않을 수 있다.",null,1,"모든 노래방은 비상구에는 비상구유도등이 설치되어야 영업 허가가 난다."],[1,2,"노래방의 경우, 다중이용업소 영업주 및 종업원이 이수해야 하는 소방안전교육을 최초 영업 시에만 이수하면 된다.",null,1,"다중이용업을 시작하기 전 최초이수 후, 2년마다 한 번씩 보수교육을 받아야 한다."],[1,2,"다중이용업소 화재배상책임보험에 가입해야 하는데, 가입하지 않으면 과태료가 부과된다.",null,0,""],[1,2,"노래방 등 다중이용업소의 비상구를 폐쇄, 훼손, 변경하는 등의 행위를 하여 적발된 경우 영업주는 영업정지를 받는다.",null,1,"1회에 50, 2회에 100, 3회 이상은 300만원의 과태료를 부과한다."],[1,2,"노래방을 운영하는 영업주는 영업장의 잘 보이는 곳에 안전시설 세부점검표를 1년에 1회 작성하고 점검하여야 하며, 손님이 안전점검표를 열람하게 하여야 한다.",null,1,"노래방 안전시설세부점검표는 분기별 1회 작성 후 1년 간 보관해야 한다."],[1,2,"피난안내도는 한글과 영어를 포함하고 그 외 1개 이상의 외국어로 작성해서 되고 있다."],[0,5,"병원소는 설치류나 집쥐 등이며, 전파방식은 쥐에 있는 쥐벼룩에 의해 물려서 전염되는 감염병은?",["발진티푸스","페스트","말라리아","일본뇌염","탄저"],1,"페스트: 병원소- 설치류나 집쥐 등 발진티푸스:병원소- 환자 말라리아: 병원소- 환자 일본뇌염: 병원소- 돼지 탄저: 병원소-: 소, 말, 양 12. 들쥐에 배설물로 배출된 병원체가 논밭에서 작업하는 농부의 상처에 투입되어 감염되며 9～10월에 자주 발생된다. "],[0,4,"해수욕장 이용방법으로 옳지 않은 것은?",["모래를 다른 사람에게 뿌리면 눈에 모래가 들어갈 수 있으므로 주의한다.","자신의 허리보다 깊은 물에서 논다.","모래 속에 날카로운 물질(조개껍데기, 뾰족한 돌, 깨진 유리병 등)이 묻혀 있을 수 있으므로 항상 신발(장금장치 있는)을 신고 다녀야 한다.","수영 중에 맨발로 바위에 올라가서 장난치지 않는다.","햇볕이 심할 때는 그늘에서 쉬는 것이 좋다."],1,""],[0,4,"수영장 이용방법으로 옳지 않은 것은?",["수영장 안에서는 뛰지 않는다.","물에 들어갈 때와 나올 때에는 벽에 설치된 계단을 이용한다.","친구와 같이 들어가면 수영 모자와 물안경을 쓰지 않아도 된다.","수영장 안으로 유리컵이나 병을 가지고 들어가지 않는다.","친구를 수영장 안으로 갑자기 밀거나 장난을 치지 않는다."],2,""],[0,4,"계곡, 강에서 물놀이 할 때 주의사항으로 옳지 않은 것은?",["물살이 센 곳에서는 수영을 하지 않는다.","급격한 수온차가 있을 수 있으므로 주의해야 한다.","춥게 느껴지면 곧바로 물 밖으로 나와서 쉬도록 한다.","신발이나 물건이 떠내려가면 빠르게 직접 가서 가져온다.","경험 없는 수영자나, 어린 아이들은 구명조끼를 착용해야한다."],3,""],[0,4,"친구가 물에 빠졌을 때 상황별 대처요령 중 옳은 것은?",["즉시 큰 소리로 인명구조요원과 어른에게 알리고 119에 신고한다.","구명조끼를 입고 친구를 구하러 물에 들어간다.","구조한 뒤에는 체온이 떨어져 있으니 비슷한 온도의 물에 젖은 옷과 수건으로 감싸준다.","친구가 침착하게 행동할 수 있게 큰소리를 내지 않고 조용히 상황을 지켜본다.","제일 키가 큰 친구를 불러 구조하게 한다."],0,""],[0,4,"물놀이 안전수칙 중 옳지 않은 것은?",["교사나 부모, 안전요원들이 지켜볼 수 있는 곳에서 물놀이를 한다.","물의 깊이가 어린이의 배꼽 정도까지 차는 곳에서만 물놀이를 한다.","물놀이 도중 몸에 소름이 돋고 몸이 떨리고 입술이 파래지면 물놀이를 중지하고 밖으로 나와 타월 등으로 몸을 따뜻하게 해준다.","햇볕이 뜨거울 때는 물이 가장 따뜻하니 물놀이에 제일 좋은 시간이다.","햇볕에 가장 강한 낮 12시~3시 사이를 피해 물놀이를 하는 것이 좋다."],3,""],[0,4,"그네를 탈 때 안전수칙으로 옳지 않은 것은?",["그네가 완전히 정지한 후에 타고 내린다.","그넷줄을 꼬지 않고 탄다.","운동을 잘 하는 사람은 타는 도중에 뛰어내려도 된다.","다른 아이가 그네를 타고 있을 때 그 앞으로 지나가거나 그 앞에서 기다리지 않는다.","배를 깔고 엎드려서 타거나 서서 타지 않는다."],2,""],[0,4,"미끄럼틀을 탈 때 안전수칙으로 옳지 않은 것은?",["올라갈 때는 손잡이를 꼭 잡고 계단 하나씩 올라간다.","빨리 내려가고 싶을 때는 뒤에 친구한테 밀어달라고 한다.","미끄럼판에서는 한 사람씩 앉아서 내려온다.","엎드려 타거나 서서 타지 않는다.","가방, 장난감을 들고 타지 않는다."],1,""],[0,4,"회전놀이기구를 탈 때 안전수칙으로 옳지 않은 것은?",["회전하는 도중에 뛰어내리거나 뛰어오르지 않는다.","회전 중에 친구와 장난하지 않는다.","회전 중에 회전대를 멈추려면 두 손으로 잡는다.","회전대를 발로 돌리지 않는다. 9.가정 내 화상사고 예방법으로 옳지 않은 것은? 정답 : ①","부모님께 칭찬을 받기 위해 몰래 부엌에서 도울 것을 찾는다.","전자레인지, 오븐, 스토브와 같은 전열 기구는 function build(i){
  const [t,a,q,o,ans,e]=DATA[i];
  if(t===1)return{i,q,e,opts:['O 맞아요','X 틀려요'],c:ans,ox:1};
  if(t===0){const idx=o.map((_,k)=>k);if(!o.some(x=>/모두|전부|위의/.test(x)))shuffle(idx);return{i,q,e,opts:idx.map(k=>o[k]),c:idx.indexOf(ans)}}
  const pool=(SP[a].length>=8?SP[a]:SP.all).filter(x=>x!==ans&&!x.includes(ans)&&!ans.includes(x));
  const cand=[...new Set(shuffle(pool.slice()))].slice(0,40).sort((x,y)=>Math.abs(x.length-ans.length)-Math.abs(y.length-ans.length));
  const opts=shuffle([ans,...cand.slice(0,3)]);
  return{i,q,e,opts,c:opts.indexOf(ans)};
}

  show(h('div',{class:'card'},h('h1',{},'🎮 영역 고르기'),h('div',{class:'grid'},
    AREAS.map(([e,n],a)=>h('button',{onclick:()=>go(a)},e+' '+n)),h('button',{class:'gold',onclick:()=>go(-1)},'🎲 모두 섞기')),
    h('button',{style:'width:100%;margin-top:10px',onclick:home},'← 처음으로')));
}

function play(cfg){const G={cfg,n:0,score:0,ok:0,combo:0,maxc:0,lives:cfg.lives,wr:[]};next(G)}
function next(G){
  if(G.n>=G.cfg.ids.length)return end(G,true);
  const Q=build(G.cfg.ids[G.n]);let left=TIME,done=false,tm;
  const hearts=()=>G.cfg.golden?'🔔':G.cfg.note?'📒':'❤️'.repeat(G.lives)+'🤍'.repeat(3-G.lives);
  const fill=h('i'),fb=h('div'),nextBtn=h('button',{class:'big navy',style:'display:none;justify-content:center'});
  const btns=Q.opts.map((o,k)=>{const b=h('button',{class:'opt',onclick:()=>pick(k)},Q.ox?o:[h('b',{},k+1),h('span',{},o)]);return b});
  function pick(k){
    if(done)return;done=true;clearInterval(tm);
    const ok=k===Q.c;btns.forEach((b,j)=>{b.disabled=true;if(j===Q.c)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
    if(ok){G.ok++;G.combo++;G.maxc=Math.max(G.maxc,G.combo);const gain=100+Math.round(left/TIME*50)+Math.min(G.combo-1,10)*10;G.score+=gain;sfx.ok();
      if(G.cfg.note)S.wrong=S.wrong.filter(x=>x!==Q.i);
      fb.className='fb ok';fb.replaceChildren(h('b',{},'⭕ 정답! +'+gain+'점'+(G.combo>1?' 🔥 '+G.combo+'콤보':'')),Q.e?h('div',{},'💡 '+Q.e):'')}
    else{G.combo=0;G.lives--;G.wr.push(Q);sfx.no();if(!S.wrong.includes(Q.i))S.wrong.push(Q.i);
      fb.className='fb no';fb.replaceChildren(h('b',{},k<0?'⏰ 시간 초과!':'❌ 아쉬워요!'),h('div',{},'정답: '+Q.opts[Q.c]),Q.e?h('div',{},'💡 '+Q.e):'')}
    save();
    const over=G.lives<=0,last=G.n+1>=G.cfg.ids.length;
    nextBtn.textContent=over?'결과 보기':last?'🏁 마지막! 결과 보기':'다음 문제 ▶';nextBtn.style.display='flex';
    nextBtn.onclick=()=>{document.removeEventListener('keydown',key);G.n++;over?end(G,false):next(G)};
    nextBtn.focus();
  }
  function key(e){if(!done){const k=Q.ox?({o:0,O:0,x:1,X:1}[e.key]):(+e.key-1);if(k>=0&&k<Q.opts.length)pick(k)}}
  document.addEventListener('keydown',key);
  show(h('div',{class:'card'},
    h('div',{class:'top'},h('span',{},G.cfg.golden?`🔔 ${G.n+1}번째 / 목표 ${G.cfg.ids.length}`:`문제 ${G.n+1}/${G.cfg.ids.length}`),h('span',{class:'chip'},G.score+'점'),h('span',{},hearts())),
    h('div',{class:'bar'},fill),
    h('div',{class:'q'},Q.q),
    Q.ox?h('div',{class:'ox'},btns):btns,fb,nextBtn));
  tm=setInterval(()=>{left-=.1;fill.style.width=Math.max(left/TIME*100,0)+'%';fill.className=left<6?'low':'';if(left<=0)pick(-1)},100);
}
function end(G,cleared){
  const n=G.n,r=n?G.ok/n:0,gold=G.cfg.golden&&cleared;
  if(G.cfg.golden)S.best.g=Math.max(S.best.g,G.ok);else S.best.p=Math.max(S.best.p,G.score);save();
  if(gold){sfx.bell();confetti()}else if(G.cfg.golden)sfx.no();else if(r>=.7){sfx.ok();confetti()}
  show(h('div',{class:'card'},
    h('div',{class:'hero'},gold?'🔔':G.cfg.golden?'😢':'🏁'),
    h('h1',{},gold?'골든벨을 울렸어요!':G.cfg.golden?'아쉽게 탈락!':'연습 끝!'),
    h('div',{class:'sub'},G.cfg.name+' 님 · '+title(r)),
    h('div',{class:'q',style:'text-align:center'},G.ok+'문제 정답 · '+G.score+'점 · 최고 콤보 '+G.maxc),
    G.wr.length?h('div',{},h('b',{},'📝 틀린 문제 복습'),G.wr.map(Q=>h('div',{class:'wl'},h('div',{},'Q. '+Q.q),h('div',{},'✅ '+Q.opts[Q.c]),Q.e?h('div',{style:'opacity:.75'},'💡 '+Q.e):''))):h('div',{class:'sub'},'모두 맞혔어요! 대단해요 👏'),
    h('button',{class:'big gold',style:'justify-content:center;margin-top:10px',onclick:()=>G.cfg.note&&!S.wrong.length?home():play({...G.cfg,ids:G.cfg.golden||G.cfg.note?shuffle((G.cfg.note?S.wrong:DATA.map((_,i)=>i)).slice()).slice(0,G.cfg.golden?G.cfg.ids.length:99):shuffle(G.cfg.ids.slice()),lives:G.cfg.lives>3?99:G.cfg.golden?1:3})},'🔁 다시 도전'),
    h('button',{class:'big',style:'justify-content:center',onclick:home},'🏠 처음으로')));
}
home();
</script>
